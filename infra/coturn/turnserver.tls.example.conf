# DeskLink production-style coturn example.
# Copy this file outside the repository, replace every placeholder, and mount
# your real certificate/key. Do not deploy CHANGE_ME values.

listening-port=3478
tls-listening-port=5349
fingerprint
realm=turn.example.com
server-name=turn.example.com

# TURN REST API / temporary credential mode.
# The signaling/auth service should mint username/password pairs from the same
# secret instead of shipping a permanent TURN password to clients.
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# TLS certificate for turns:turn.example.com:5349.
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
no-tlsv1
no-tlsv1_1

# If the TURN host itself is behind 1:1 NAT, uncomment and set the mapping.
# external-ip=PUBLIC_IP/PRIVATE_IP

# Keep the relay range intentionally bounded so firewall/security-group rules
# are explicit. Increase it for production concurrency after load testing.
min-port=49160
max-port=49299

no-multicast-peers
no-loopback-peers
no-cli
stale-nonce=600

# Recommended production logging destination can be supplied by your container
# runtime/systemd. Avoid verbose logs containing credential material.
# simple-log
