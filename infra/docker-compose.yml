services:
  signal:
    image: golang:1.23-alpine
    working_dir: /src
    command: sh -c "go mod download && go run ."
    volumes:
      - ../apps/signal:/src
    environment:
      DESKLINK_SIGNAL_ADDR: :8080
      DESKLINK_ALLOW_ANY_ORIGIN: "1"
      # Empty keeps local development backward-compatible. Production should
      # inject a long random secret only after clients receive short-lived
      # registration tokens from a trusted provisioning service.
      DESKLINK_SIGNAL_AUTH_SECRET: ${DESKLINK_SIGNAL_AUTH_SECRET:-}
    ports:
      - "8080:8080"

  turn:
    image: coturn/coturn:4.6.3
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
