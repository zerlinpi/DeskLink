name: One-shot Web control capability integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-capabilities.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Bind HostCapabilitiesV1 to the active control channel lifecycle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'import { createControllerSessionTokenRequest } from "./controller_token_request";\n',
                  'import { createControllerSessionTokenRequest } from "./controller_token_request";\nimport { decodeControlChannelText } from "./control_channel_message";\nimport type { HostCapabilitiesV1 } from "./host_capabilities";\n',
              ),
              (
                  '  const [networkView, setNetworkView] = useState<NetworkView>(EMPTY_NETWORK_VIEW);\n',
                  '  const [networkView, setNetworkView] = useState<NetworkView>(EMPTY_NETWORK_VIEW);\n  const [hostCapabilities, setHostCapabilities] = useState<HostCapabilitiesV1 | null>(null);\n',
              ),
              (
                  '''    pendingLocalIceRef.current = [];\n    pendingRemoteIceRef.current = [];\n\n    const pc = new RTCPeerConnection({\n''',
                  '''    pendingLocalIceRef.current = [];\n    pendingRemoteIceRef.current = [];\n    setHostCapabilities(null);\n\n    const pc = new RTCPeerConnection({\n''',
              ),
              (
                  '''    control.onclose = () => {\n      if (controlRef.current === control) stopTelemetry();\n    };\n\n    const pointer = pc.createDataChannel("pointer", {\n''',
                  '''    control.onmessage = (event) => {\n      if (!isActiveSessionResource(controlRef.current, control, manualDisconnectRef.current) ||\n          !isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current) ||\n          typeof event.data !== "string") {\n        return;\n      }\n\n      const decoded = decodeControlChannelText(event.data);\n      if (decoded.kind === "host-capabilities") {\n        setHostCapabilities(decoded.capabilities);\n      } else if (decoded.kind === "invalid" && event.data.includes('"t":"host-capabilities"')) {\n        console.debug("DeskLink rejected malformed host capabilities");\n      }\n    };\n    control.onclose = () => {\n      if (controlRef.current === control) {\n        stopTelemetry();\n        setHostCapabilities(null);\n      }\n    };\n\n    const pointer = pc.createDataChannel("pointer", {\n''',
              ),
              (
                  '''    setNetworkView(EMPTY_NETWORK_VIEW);\n    clearRuntimeControllerSession();\n    setStatus(nextStatus);\n''',
                  '''    setNetworkView(EMPTY_NETWORK_VIEW);\n    setHostCapabilities(null);\n    clearRuntimeControllerSession();\n    setStatus(nextStatus);\n''',
              ),
              (
                  '''            <span>Decode {networkView.decodeFps.toFixed(0)} fps</span>\n            <span>Avail {bitrateMbps} Mbps</span>\n''',
                  '''            <span>Decode {networkView.decodeFps.toFixed(0)} fps</span>\n            <span>Avail {bitrateMbps} Mbps</span>\n            <span>{hostCapabilities\n              ? `Host ${hostCapabilities.maximumFps > 0 ? `${hostCapabilities.maximumFps} fps` : "caps ready"}`\n              : "Host caps pending"}</span>\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one capability integration anchor, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Web tests
        working-directory: apps/web
        run: npm test
      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): consume host capabilities on active control channel"
          git push origin HEAD:main
