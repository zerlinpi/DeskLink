name: One-shot telemetry ownership guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-telemetry-owner.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Make telemetry single-flight and resource scoped
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          ref_anchor = '''  const statsTimerRef = useRef<number | null>(null);\n  const statsBaselineRef = useRef<StatsBaseline | null>(null);\n'''
          ref_new = '''  const statsTimerRef = useRef<number | null>(null);\n  const statsBaselineRef = useRef<StatsBaseline | null>(null);\n  const telemetryAttemptRef = useRef(new AsyncAttemptCoordinator());\n'''
          if text.count(ref_anchor) != 1:
              raise SystemExit(f'telemetry ref anchor count={text.count(ref_anchor)}')
          text = text.replace(ref_anchor, ref_new, 1)

          stop_anchor = '''  const stopTelemetry = () => {\n    if (statsTimerRef.current !== null) window.clearInterval(statsTimerRef.current);\n    statsTimerRef.current = null;\n    statsBaselineRef.current = null;\n  };\n'''
          stop_new = '''  const stopTelemetry = () => {\n    if (statsTimerRef.current !== null) window.clearInterval(statsTimerRef.current);\n    statsTimerRef.current = null;\n    statsBaselineRef.current = null;\n    telemetryAttemptRef.current.invalidate();\n  };\n'''
          if text.count(stop_anchor) != 1:
              raise SystemExit(f'stopTelemetry anchor count={text.count(stop_anchor)}')
          text = text.replace(stop_anchor, stop_new, 1)

          start_anchor = '''  const collectTelemetry = async (pc: RTCPeerConnection) => {\n    if (pc.connectionState !== "connected" || controlRef.current?.readyState !== "open") return;\n\n    try {\n      const report = await pc.getStats();\n'''
          start_new = '''  const collectTelemetry = async (pc: RTCPeerConnection) => {\n    const attempt = telemetryAttemptRef.current.begin("telemetry");\n    if (!attempt) return;\n\n    const control = controlRef.current;\n    const resourcesCurrent = () =>\n      telemetryAttemptRef.current.isCurrent(attempt) &&\n      isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current) &&\n      control !== null &&\n      isActiveSessionResource(controlRef.current, control, manualDisconnectRef.current) &&\n      pc.connectionState === "connected" &&\n      control.readyState === "open";\n\n    try {\n      if (!resourcesCurrent()) return;\n      const report = await pc.getStats();\n      if (!resourcesCurrent()) return;\n'''
          if text.count(start_anchor) != 1:
              raise SystemExit(f'collectTelemetry start anchor count={text.count(start_anchor)}')
          text = text.replace(start_anchor, start_new, 1)

          catch_anchor = '''    } catch (error) {\n      console.debug("DeskLink telemetry collection failed", error);\n    }\n  };\n\n  const startTelemetry = (pc: RTCPeerConnection) => {\n'''
          catch_new = '''    } catch (error) {\n      if (telemetryAttemptRef.current.isCurrent(attempt)) {\n        console.debug("DeskLink telemetry collection failed", error);\n      }\n    } finally {\n      telemetryAttemptRef.current.finish(attempt);\n    }\n  };\n\n  const startTelemetry = (pc: RTCPeerConnection) => {\n'''
          if text.count(catch_anchor) != 1:
              raise SystemExit(f'collectTelemetry catch anchor count={text.count(catch_anchor)}')
          path.write_text(text.replace(catch_anchor, catch_new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Validate Web controller
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Commit, rebase and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git commit -m "fix(web): scope telemetry to the active peer lifecycle"
          git fetch origin main
          git rebase origin/main
          pushd apps/web
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          popd
          git push origin HEAD:main
