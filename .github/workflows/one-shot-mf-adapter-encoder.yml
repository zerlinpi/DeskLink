name: One-shot adapter-aware Media Foundation encoder integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-mf-adapter-encoder.yml

permissions:
  contents: write

jobs:
  windows-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply adapter-aware encoder integration
        shell: pwsh
        run: |
          python tools/ci/integrate-mf-adapter-encoder.py
          if ($LASTEXITCODE -ne 0) { throw "adapter-aware encoder integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed" }

      - name: Validate adapter-aware selection source invariants
        shell: pwsh
        run: |
          $source = Get-Content "apps/windows-agent/src/h264_encoder.cpp" -Raw
          foreach ($required in @(
            "MFT_ENUM_ADAPTER_LUID",
            "MFTEnum2(",
            "TryGetAdapterLuid",
            "MFTEnumEx(",
            "capture-adapter match",
            "global fallback"
          )) {
            if (-not $source.Contains($required)) { throw "missing encoder selection invariant: $required" }
          }

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build encoder consumers
        run: cmake --build build/windows-agent --config Release --parallel --target desklink-agent desklink-media-probe

      - name: Ensure main has not advanced
        shell: pwsh
        run: |
          git fetch origin main
          $remote = (git rev-parse origin/main).Trim()
          if ($remote -ne $env:GITHUB_SHA) { throw "main advanced while encoder validation was running; refusing stale write" }

      - name: Commit validated encoder integration
        shell: pwsh
        run: |
          python tools/ci/integrate-mf-adapter-encoder.py
          if ($LASTEXITCODE -ne 0) { throw "adapter-aware encoder integration failed on commit checkout" }
          Remove-Item "tools/ci/integrate-mf-adapter-encoder.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/h264_encoder.cpp tools/ci/integrate-mf-adapter-encoder.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged diff check failed" }
          git commit -m "perf(windows): prefer capture-adapter H264 encoder"
          git push origin HEAD:main
