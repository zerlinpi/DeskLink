name: Apply Input Disconnect Failsafe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-input-failsafe.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authoritative input cleanup
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("apps/windows-agent/src/webrtc_session.cpp")
          text = path.read_text(encoding="utf-8")

          old = (
              '  peer->onStateChange([](rtc::PeerConnection::State state) {\n'
              '    std::cout << "WebRTC state: " << state << "\\n";\n'
              '  });\n'
              '  peer->onIceStateChange([](rtc::PeerConnection::IceState state) {\n'
              '    std::cout << "ICE state: " << state << "\\n";\n'
              '  });'
          )
          new = (
              '  const std::weak_ptr<rtc::PeerConnection> weak_peer = peer;\n'
              '  peer->onStateChange([this, weak_peer](rtc::PeerConnection::State state) {\n'
              '    auto owner = weak_peer.lock();\n'
              '    if (!owner) return;\n'
              '    {\n'
              '      std::scoped_lock lock(mutex_);\n'
              '      if (peer_ != owner) return;\n'
              '    }\n\n'
              '    if (state == rtc::PeerConnection::State::Disconnected ||\n'
              '        state == rtc::PeerConnection::State::Failed ||\n'
              '        state == rtc::PeerConnection::State::Closed) {\n'
              '      // Do not wait for DataChannel close callbacks: during Wi-Fi/IP/NAT\n'
              '      // transitions SCTP can remain half-open long enough to leave a\n'
              '      // modifier or mouse button logically pressed on Windows.\n'
              '      input_.ReleaseAll();\n'
              '    }\n'
              '    std::cout << "WebRTC state: " << state << "\\n";\n'
              '  });\n'
              '  peer->onIceStateChange([](rtc::PeerConnection::IceState state) {\n'
              '    std::cout << "ICE state: " << state << "\\n";\n'
              '  });'
          )
          if text.count(old) != 1:
              raise SystemExit(f"state callback anchor mismatch: {text.count(old)}")
          text = text.replace(old, new)

          old = (
              '  const std::weak_ptr<rtc::PeerConnection> weak_peer = peer;\n'
              '  peer->onDataChannel([this, weak_peer](std::shared_ptr<rtc::DataChannel> channel) {'
          )
          new = '  peer->onDataChannel([this, weak_peer](std::shared_ptr<rtc::DataChannel> channel) {'
          if text.count(old) != 1:
              raise SystemExit(f"weak peer anchor mismatch: {text.count(old)}")
          text = text.replace(old, new)

          old = (
              '  channel->onClosed([this, label, weak_channel]() {\n'
              '    if (label == "control") {\n'
              '      input_.ReleaseAll();\n'
              '      auto closed = weak_channel.lock();\n'
              '      std::scoped_lock lock(mutex_);\n'
              '      if (!closed || control_ == closed) control_.reset();\n'
              '    }\n'
              '    std::cout << label << " DataChannel closed\\n";\n'
              '  });'
          )
          new = (
              '  channel->onClosed([this, label, weak_channel]() {\n'
              '    if (label == "control" || label == "pointer") {\n'
              '      // Closing either input channel is a loss-of-authority boundary.\n'
              '      // Release injected state immediately rather than risking a stuck key/button.\n'
              '      input_.ReleaseAll();\n'
              '    }\n'
              '    if (label == "control") {\n'
              '      auto closed = weak_channel.lock();\n'
              '      std::scoped_lock lock(mutex_);\n'
              '      if (!closed || control_ == closed) control_.reset();\n'
              '    }\n'
              '    std::cout << label << " DataChannel closed\\n";\n'
              '  });'
          )
          if text.count(old) != 1:
              raise SystemExit(f"channel close anchor mismatch: {text.count(old)}")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Run native smokes
        shell: pwsh
        run: |
          & "build/windows-agent/Release/desklink-video-policy-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "video policy smoke failed" }
          & "build/windows-agent/Release/desklink-active-session-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "active session smoke failed" }
          & "build/windows-agent/Release/desklink-h264-annexb-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "H264 smoke failed" }

      - name: Commit validated failsafe to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/webrtc_session.cpp
          if (git diff --cached --quiet) { throw "Input failsafe patch produced no changes" }
          git commit -m "fix(windows): release injected input on transport loss"
          git pull --rebase origin main
          git push origin HEAD:main
