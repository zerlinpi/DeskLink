name: One-shot telemetry resource ownership

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-telemetry-ownership.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Ignore telemetry from stale peer resources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  const collectTelemetry = async (pc: RTCPeerConnection) => {\n    if (pc.connectionState !== "connected" || controlRef.current?.readyState !== "open") return;\n\n    try {\n      const report = await pc.getStats();\n',
                  '  const collectTelemetry = async (pc: RTCPeerConnection) => {\n    if (!isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current) ||\n        pc.connectionState !== "connected" || controlRef.current?.readyState !== "open") {\n      return;\n    }\n\n    try {\n      const report = await pc.getStats();\n      if (!isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current)) return;\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one telemetry ownership anchor, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - name: Typecheck Web controller
        working-directory: apps/web
        run: npm run typecheck
      - name: Run Web tests
        working-directory: apps/web
        run: npm test
      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): ignore stale telemetry results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
