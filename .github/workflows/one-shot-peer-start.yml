name: One-shot initial peer lifecycle guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-peer-start.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Add attempt ownership and bind initial peer startup to active session
        shell: bash
        run: |
          cat > apps/web/src/async_attempt.ts <<'EOF'
          export type AsyncAttemptId = symbol;

          export class AsyncAttemptCoordinator {
            private active: AsyncAttemptId | null = null;

            begin(label = "attempt"): AsyncAttemptId | null {
              if (this.active) return null;
              const id = Symbol(label);
              this.active = id;
              return id;
            }

            isCurrent(id: AsyncAttemptId): boolean {
              return this.active === id;
            }

            invalidate(): void {
              this.active = null;
            }

            finish(id: AsyncAttemptId): void {
              if (this.active === id) this.active = null;
            }
          }
          EOF

          cat > apps/web/src/async_attempt.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { AsyncAttemptCoordinator } from "./async_attempt";

          describe("AsyncAttemptCoordinator", () => {
            it("allows only one active attempt", () => {
              const attempts = new AsyncAttemptCoordinator();
              const first = attempts.begin("first");
              expect(first).not.toBeNull();
              expect(attempts.begin("second")).toBeNull();
              expect(first && attempts.isCurrent(first)).toBe(true);
            });

            it("lets an invalidated lifecycle start a new attempt", () => {
              const attempts = new AsyncAttemptCoordinator();
              const first = attempts.begin("old");
              expect(first).not.toBeNull();
              attempts.invalidate();
              const second = attempts.begin("new");
              expect(second).not.toBeNull();
              expect(first && attempts.isCurrent(first)).toBe(false);
              expect(second && attempts.isCurrent(second)).toBe(true);
            });

            it("does not let an old finally clear a newer attempt", () => {
              const attempts = new AsyncAttemptCoordinator();
              const oldAttempt = attempts.begin("old");
              if (!oldAttempt) throw new Error("old attempt was not created");
              attempts.invalidate();
              const newAttempt = attempts.begin("new");
              if (!newAttempt) throw new Error("new attempt was not created");

              attempts.finish(oldAttempt);
              expect(attempts.isCurrent(newAttempt)).toBe(true);
              attempts.finish(newAttempt);
              expect(attempts.begin("after-finish")).not.toBeNull();
            });
          });
          EOF

          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { accessProofAlgorithm, createAccessProof } from "./access_proof";\n'
          import_new = import_anchor + 'import { AsyncAttemptCoordinator } from "./async_attempt";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'async attempt import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_new, 1)

          ref_anchor = '  const initialPeerStartingRef = useRef(false);\n'
          ref_new = '  const initialPeerAttemptRef = useRef(new AsyncAttemptCoordinator());\n'
          if text.count(ref_anchor) != 1:
              raise SystemExit(f'initial peer ref anchor count={text.count(ref_anchor)}')
          text = text.replace(ref_anchor, ref_new, 1)

          start_anchor = '''  const startInitialPeer = async () => {\n    if (initialPeerStartingRef.current || pcRef.current || manualDisconnectRef.current) return;\n    initialPeerStartingRef.current = true;\n    setStatus("negotiating WebRTC");\n    try {\n      const authToken = await ensureSignalAuthToken(false);\n      const iceServers = await resolveIceServers(localId, authToken);\n      if (manualDisconnectRef.current || pcRef.current) return;\n\n      const pc = createPeer(iceServers);\n      const transceiver = pc.addTransceiver("video", { direction: "recvonly" });\n      const videoCapabilities = RTCRtpReceiver.getCapabilities("video");\n      const h264Codecs = videoCapabilities?.codecs.filter(\n        (codec) => codec.mimeType.toLowerCase() === "video/h264",\n      );\n      if (h264Codecs?.length) transceiver.setCodecPreferences(h264Codecs);\n\n      if (!await sendOffer(pc, false)) setStatus("signal error");\n    } catch (error) {\n      console.debug("DeskLink initial connection setup failed", error);\n      disconnect(TURN_RUNTIME_REQUIRED ? "TURN credential error" : "signal error");\n    } finally {\n      initialPeerStartingRef.current = false;\n    }\n  };\n'''
          start_new = '''  const startInitialPeer = async (sourceSocket: WebSocket) => {\n    if (pcRef.current || manualDisconnectRef.current) return;\n    const attempt = initialPeerAttemptRef.current.begin("initial-peer");\n    if (!attempt) return;\n\n    const expectedSession = sessionRef.current;\n    const expectedTarget = targetId.trim();\n    const startupScopeCurrent = () =>\n      initialPeerAttemptRef.current.isCurrent(attempt) &&\n      isSignalCallbackScopeCurrent({\n        manualDisconnect: manualDisconnectRef.current,\n        sourceSocketCurrent: wsRef.current === sourceSocket,\n        expectedSession,\n        currentSession: sessionRef.current,\n        expectedTarget,\n        currentTarget: targetId.trim(),\n      });\n\n    setStatus("negotiating WebRTC");\n    try {\n      const authToken = await ensureSignalAuthToken(false);\n      if (!startupScopeCurrent()) return;\n      const iceServers = await resolveIceServers(localId, authToken);\n      if (!startupScopeCurrent() || pcRef.current) return;\n\n      const pc = createPeer(iceServers);\n      const transceiver = pc.addTransceiver("video", { direction: "recvonly" });\n      const videoCapabilities = RTCRtpReceiver.getCapabilities("video");\n      const h264Codecs = videoCapabilities?.codecs.filter(\n        (codec) => codec.mimeType.toLowerCase() === "video/h264",\n      );\n      if (h264Codecs?.length) transceiver.setCodecPreferences(h264Codecs);\n\n      const offerSent = await sendOffer(pc, false);\n      if (!startupScopeCurrent()) return;\n      if (!offerSent) setStatus("signal error");\n    } catch (error) {\n      if (!startupScopeCurrent()) return;\n      console.debug("DeskLink initial connection setup failed", error);\n      disconnect(TURN_RUNTIME_REQUIRED ? "TURN credential error" : "signal error");\n    } finally {\n      initialPeerAttemptRef.current.finish(attempt);\n    }\n  };\n'''
          if text.count(start_anchor) != 1:
              raise SystemExit(f'startInitialPeer anchor count={text.count(start_anchor)}')
          text = text.replace(start_anchor, start_new, 1)

          accepted_anchor = '''    if (msg.type === "auth-accepted") {\n      clearHostWaitRefreshTimer();\n      await startInitialPeer();\n      return;\n    }\n'''
          accepted_new = '''    if (msg.type === "auth-accepted") {\n      clearHostWaitRefreshTimer();\n      await startInitialPeer(sourceSocket);\n      return;\n    }\n'''
          if text.count(accepted_anchor) != 1:
              raise SystemExit(f'auth-accepted anchor count={text.count(accepted_anchor)}')
          text = text.replace(accepted_anchor, accepted_new, 1)

          disconnect_anchor = '    initialPeerStartingRef.current = false;\n'
          disconnect_new = '    initialPeerAttemptRef.current.invalidate();\n'
          if text.count(disconnect_anchor) != 1:
              raise SystemExit(f'disconnect peer attempt anchor count={text.count(disconnect_anchor)}')
          path.write_text(text.replace(disconnect_anchor, disconnect_new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Validate Web controller
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Commit, rebase and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/async_attempt.ts apps/web/src/async_attempt.test.ts
          git diff --cached --check
          git commit -m "fix(web): bind initial peer startup to active lifecycle"
          git fetch origin main
          git rebase origin/main
          pushd apps/web
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          popd
          git push origin HEAD:main
