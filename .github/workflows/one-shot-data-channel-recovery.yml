name: One-shot DataChannel recovery integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-data-channel-recovery.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Integrate bounded DataChannel replacement recovery
        run: |
          python3 tools/tmp-integrate-data-channel-recovery.py
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Commit integration to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/home_ui.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No DataChannel integration changes to commit"
            exit 0
          fi
          git commit -m "feat(web): recover closed control and pointer channels"
          git push origin HEAD:main
