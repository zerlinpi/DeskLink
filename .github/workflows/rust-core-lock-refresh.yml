name: Rust Core Lock Refresh

on:
  push:
    branches:
      - prototype/rust-core
    paths:
      - .github/workflows/rust-core-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/rust-core
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Resolve benchmark dependencies
        run: cargo generate-lockfile
      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rust-core-lock-refresh.yml
          git add Cargo.lock
          git diff --cached --check
          git commit -m "prototype(rust): lock benchmark dependencies"
          git push origin HEAD:prototype/rust-core
