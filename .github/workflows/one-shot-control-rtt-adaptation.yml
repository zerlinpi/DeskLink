name: One-shot control RTT adaptation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-rtt-adaptation.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-control-rtt-${{ runner.os }}-${{ hashFiles('VERSION', 'apps/windows-agent/CMakeLists.txt', 'packages/protocol/**') }}

      - name: Apply control RTT feedback integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          web = "apps/web/src/main.tsx"
          replace_once(
              web,
              '  const controlRttProbeRef = useRef<PendingControlRttProbe | null>(null);\n  const telemetryAttemptRef = useRef(new AsyncAttemptCoordinator());',
              '  const controlRttProbeRef = useRef<PendingControlRttProbe | null>(null);\n  const controlRttMsRef = useRef<number | null>(null);\n  const telemetryAttemptRef = useRef(new AsyncAttemptCoordinator());',
          )
          replace_once(
              web,
              '    if (pending) {\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));\n    }',
              '    if (pending) {\n      controlRttMsRef.current = null;\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));\n    }',
          )
          replace_once(
              web,
              '        t: "telemetry",\n        rttMs,\n        lossPct,',
              '        t: "telemetry",\n        rttMs,\n        controlRttMs: controlRttMsRef.current,\n        lossPct,',
          )
          replace_once(
              web,
              '      controlRttProbeRef.current = null;\n      sendControlRttProbe(control);',
              '      controlRttProbeRef.current = null;\n      controlRttMsRef.current = null;\n      sendControlRttProbe(control);',
          )
          replace_once(
              web,
              '        if (measured !== null) {\n          controlRttProbeRef.current = null;\n          setNetworkView((current) => ({ ...current, controlRttMs: measured }));',
              '        if (measured !== null) {\n          controlRttProbeRef.current = null;\n          controlRttMsRef.current = measured;\n          setNetworkView((current) => ({ ...current, controlRttMs: measured }));',
          )
          replace_once(
              web,
              '      stopTelemetry();\n      controlRttProbeRef.current = null;\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));',
              '      stopTelemetry();\n      controlRttProbeRef.current = null;\n      controlRttMsRef.current = null;\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));',
          )
          replace_once(
              web,
              '    resetDataChannelRecoveryState();\n    controlRttProbeRef.current = null;\n    iceRestartInFlightRef.current = false;',
              '    resetDataChannelRecoveryState();\n    controlRttProbeRef.current = null;\n    controlRttMsRef.current = null;\n    iceRestartInFlightRef.current = false;',
          )

          replace_once(
              "apps/windows-agent/src/webrtc_session.h",
              '  double rtt_ms{0.0};\n  double decode_fps{0.0};',
              '  double rtt_ms{0.0};\n  double control_rtt_ms{0.0};\n  double decode_fps{0.0};',
          )
          replace_once(
              "apps/windows-agent/src/webrtc_session.cpp",
              '      feedback.rtt_ms = std::clamp(JsonNumber(event, "rttMs"), 0.0, 5000.0);\n      feedback.jitter_ms =',
              '      feedback.rtt_ms = std::clamp(JsonNumber(event, "rttMs"), 0.0, 5000.0);\n      feedback.control_rtt_ms = std::clamp(JsonNumber(event, "controlRttMs"), 0.0, 5000.0);\n      feedback.jitter_ms =',
          )

          replace_once(
              "apps/windows-agent/src/video_policy.h",
              'enum class AdaptationMode : uint8_t {\n  Desktop = 0,\n  Game = 1,\n};\n',
              'enum class AdaptationMode : uint8_t {\n  Desktop = 0,\n  Game = 1,\n};\n\nenum class ControlLatencyState : uint8_t {\n  Unknown = 0,\n  Healthy = 1,\n  Elevated = 2,\n  Moderate = 3,\n  Severe = 4,\n};\n',
          )
          replace_once(
              "apps/windows-agent/src/video_policy.h",
              '// Desktop mode preserves text clarity and resolution for as long as possible.\n',
              '// Classifies application-level reliable control-channel RTT. Unknown samples do\n// not force degradation; Elevated samples pause recovery; Moderate/Severe are\n// only acted on by the host after consecutive samples.\nControlLatencyState ClassifyControlRttMs(double rtt_ms);\n\n// Desktop mode preserves text clarity and resolution for as long as possible.\n',
          )
          replace_once(
              "apps/windows-agent/src/video_policy.cpp",
              '#include <algorithm>\n#include <cstdint>\n',
              '#include <algorithm>\n#include <cmath>\n#include <cstdint>\n',
          )
          replace_once(
              "apps/windows-agent/src/video_policy.cpp",
              'namespace desklink {\n\nAdaptationPolicy AdaptationPolicyForMode',
              'namespace desklink {\n\nControlLatencyState ClassifyControlRttMs(double rtt_ms) {\n  if (!std::isfinite(rtt_ms) || rtt_ms <= 0.0) return ControlLatencyState::Unknown;\n  if (rtt_ms < 120.0) return ControlLatencyState::Healthy;\n  if (rtt_ms < 180.0) return ControlLatencyState::Elevated;\n  if (rtt_ms < 300.0) return ControlLatencyState::Moderate;\n  return ControlLatencyState::Severe;\n}\n\nAdaptationPolicy AdaptationPolicyForMode',
          )

          smoke = "apps/windows-agent/src/video_policy_smoke.cpp"
          replace_once(
              smoke,
              '  using desklink::CaptureTimeoutMsForFps;\n  using desklink::DefaultBitrateForFps;',
              '  using desklink::CaptureTimeoutMsForFps;\n  using desklink::ClassifyControlRttMs;\n  using desklink::ControlLatencyState;\n  using desklink::DefaultBitrateForFps;',
          )
          replace_once(
              smoke,
              '  Require(PacingIntervalMsForFps(144) == 2, "144 fps pacing interval");\n\n  const auto desktop',
              '  Require(PacingIntervalMsForFps(144) == 2, "144 fps pacing interval");\n\n  Require(ClassifyControlRttMs(0.0) == ControlLatencyState::Unknown, "missing control RTT");\n  Require(ClassifyControlRttMs(119.9) == ControlLatencyState::Healthy, "healthy control RTT");\n  Require(ClassifyControlRttMs(120.0) == ControlLatencyState::Elevated, "elevated control RTT lower bound");\n  Require(ClassifyControlRttMs(179.9) == ControlLatencyState::Elevated, "elevated control RTT upper bound");\n  Require(ClassifyControlRttMs(180.0) == ControlLatencyState::Moderate, "moderate control RTT lower bound");\n  Require(ClassifyControlRttMs(299.9) == ControlLatencyState::Moderate, "moderate control RTT upper bound");\n  Require(ClassifyControlRttMs(300.0) == ControlLatencyState::Severe, "severe control RTT lower bound");\n\n  const auto desktop',
          )

          main = "apps/windows-agent/src/main.cpp"
          replace_once(
              main,
              '  uint32_t resolution_pressure_streak = 0;\n  uint32_t resolution_healthy_streak = 0;\n  desklink::AdaptationMode adaptation_mode = desklink::AdaptationMode::Desktop;',
              '  uint32_t resolution_pressure_streak = 0;\n  uint32_t resolution_healthy_streak = 0;\n  uint32_t control_latency_pressure_streak = 0;\n  desklink::AdaptationMode adaptation_mode = desklink::AdaptationMode::Desktop;',
          )
          replace_once(
              main,
              '    resolution_pressure_streak = 0;\n    resolution_healthy_streak = 0;\n    const auto now = std::chrono::steady_clock::now();\n    last_bitrate_change = now;',
              '    resolution_pressure_streak = 0;\n    resolution_healthy_streak = 0;\n    control_latency_pressure_streak = 0;\n    const auto now = std::chrono::steady_clock::now();\n    last_bitrate_change = now;',
          )
          replace_once(
              main,
              '    resolution_pressure_streak = 0;\n    resolution_healthy_streak = 0;\n    const auto now = std::chrono::steady_clock::now();\n    last_bitrate_change = now - std::chrono::seconds(10);',
              '    resolution_pressure_streak = 0;\n    resolution_healthy_streak = 0;\n    control_latency_pressure_streak = 0;\n    const auto now = std::chrono::steady_clock::now();\n    last_bitrate_change = now - std::chrono::seconds(10);',
          )
          replace_once(
              main,
              '    const bool capacity_healthy = feedback.available_incoming_bitrate_bps <= 0.0 ||\n                                  feedback.available_incoming_bitrate_bps >\n                                      static_cast<double>(current) * 1.25;\n\n    const bool severe = feedback.loss_ratio >= 0.08 ||',
              '    const bool capacity_healthy = feedback.available_incoming_bitrate_bps <= 0.0 ||\n                                  feedback.available_incoming_bitrate_bps >\n                                      static_cast<double>(current) * 1.25;\n\n    const desklink::ControlLatencyState control_latency =\n        desklink::ClassifyControlRttMs(feedback.control_rtt_ms);\n    const bool control_pressure_now =\n        control_latency == desklink::ControlLatencyState::Moderate ||\n        control_latency == desklink::ControlLatencyState::Severe;\n    if (control_pressure_now) {\n      control_latency_pressure_streak = std::min<uint32_t>(\n          control_latency_pressure_streak + 1, 60);\n    } else {\n      control_latency_pressure_streak = 0;\n    }\n    const bool sustained_control_severe =\n        control_latency == desklink::ControlLatencyState::Severe &&\n        control_latency_pressure_streak >= 2;\n    const bool sustained_control_moderate =\n        control_pressure_now && control_latency_pressure_streak >= 2;\n    const bool control_latency_healthy =\n        control_latency == desklink::ControlLatencyState::Unknown ||\n        control_latency == desklink::ControlLatencyState::Healthy;\n\n    const bool severe = feedback.loss_ratio >= 0.08 ||',
          )
          replace_once(
              main,
              '                        feedback.jitter_ms >= 80.0 ||\n                        capacity_severe;\n    const bool moderate = feedback.loss_ratio >= 0.03 ||\n                          feedback.rtt_ms >= 160.0 ||\n                          feedback.jitter_ms >= 45.0 ||\n                          capacity_moderate;\n    const bool healthy = feedback.loss_ratio < 0.01 &&\n                         (feedback.rtt_ms <= 0.0 || feedback.rtt_ms < 100.0) &&\n                         feedback.jitter_ms < 30.0 &&\n                         capacity_healthy;',
              '                        feedback.jitter_ms >= 80.0 ||\n                        capacity_severe ||\n                        sustained_control_severe;\n    const bool moderate = feedback.loss_ratio >= 0.03 ||\n                          feedback.rtt_ms >= 160.0 ||\n                          feedback.jitter_ms >= 45.0 ||\n                          capacity_moderate ||\n                          sustained_control_moderate;\n    const bool healthy = feedback.loss_ratio < 0.01 &&\n                         (feedback.rtt_ms <= 0.0 || feedback.rtt_ms < 100.0) &&\n                         feedback.jitter_ms < 30.0 &&\n                         capacity_healthy &&\n                         control_latency_healthy;',
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "control RTT patch failed" }
          git diff --check

      - name: Validate Web controller
        working-directory: apps/web
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { throw "npm audit failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Web tests failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Web build failed" }

      - name: Configure Windows host
        shell: pwsh
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host
        shell: pwsh
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Validate control RTT adaptation policy
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-video-policy-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "video policy smoke failed" }
          $web = Get-Content "apps/web/src/main.tsx" -Raw
          if ($web -notmatch 'controlRttMs: controlRttMsRef\.current') { throw "Web telemetry does not publish control RTT" }
          $host = Get-Content "apps/windows-agent/src/webrtc_session.cpp" -Raw
          if ($host -notmatch 'control_rtt_ms') { throw "Windows host does not parse control RTT" }

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/windows-agent/src/webrtc_session.h apps/windows-agent/src/webrtc_session.cpp apps/windows-agent/src/video_policy.h apps/windows-agent/src/video_policy.cpp apps/windows-agent/src/video_policy_smoke.cpp apps/windows-agent/src/main.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged diff check failed" }
          git commit -m "feat: feed control RTT into adaptive streaming"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "push failed" }
