name: One-shot pointer backpressure integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pointer-backpressure.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Integrate latest-wins pointer sender backpressure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import { encodePointerMove, encodePointerWheel } from "./pointer_wire";\n',
                  'import { encodePointerMove, encodePointerWheel } from "./pointer_wire";\nimport {\n  POINTER_MOVE_BUFFER_BUDGET_BYTES,\n  shouldDeferPointerMove,\n} from "./pointer_transport";\n',
              ),
              (
                  '''  const queuePointerMove = (payload: PointerPayload) => {\n    pendingMoveRef.current = payload;\n    if (pointerRafRef.current !== null) return;\n    pointerRafRef.current = requestAnimationFrame(() => {\n      pointerRafRef.current = null;\n      const latest = pendingMoveRef.current;\n      pendingMoveRef.current = null;\n      if (latest) sendPointerFast(encodePointerMove(latest.x, latest.y));\n    });\n  };\n''',
                  '''  const flushPendingPointerMove = () => {\n    const latest = pendingMoveRef.current;\n    const channel = pointerRef.current;\n    if (!latest || channel?.readyState !== "open") return;\n\n    channel.bufferedAmountLowThreshold = POINTER_MOVE_BUFFER_BUDGET_BYTES;\n    if (shouldDeferPointerMove(channel.bufferedAmount)) return;\n\n    try {\n      channel.send(encodePointerMove(latest.x, latest.y));\n      if (pendingMoveRef.current === latest) pendingMoveRef.current = null;\n    } catch (error) {\n      console.debug("DeskLink pointer move send deferred", error);\n    }\n  };\n\n  const queuePointerMove = (payload: PointerPayload) => {\n    pendingMoveRef.current = payload;\n    if (pointerRafRef.current !== null) return;\n    pointerRafRef.current = requestAnimationFrame(() => {\n      pointerRafRef.current = null;\n      flushPendingPointerMove();\n    });\n  };\n''',
              ),
              (
                  '''    const pointer = pc.createDataChannel("pointer", {\n      ordered: false,\n      maxRetransmits: 0,\n    });\n    pointerRef.current = pointer;\n\n    return pc;\n''',
                  '''    const pointer = pc.createDataChannel("pointer", {\n      ordered: false,\n      maxRetransmits: 0,\n    });\n    pointer.bufferedAmountLowThreshold = POINTER_MOVE_BUFFER_BUDGET_BYTES;\n    pointerRef.current = pointer;\n    pointer.onopen = () => {\n      if (!isActiveSessionResource(pointerRef.current, pointer, manualDisconnectRef.current) ||\n          !isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current)) {\n        return;\n      }\n      flushPendingPointerMove();\n    };\n    pointer.onbufferedamountlow = () => {\n      if (!isActiveSessionResource(pointerRef.current, pointer, manualDisconnectRef.current) ||\n          !isActiveSessionResource(pcRef.current, pc, manualDisconnectRef.current)) {\n        return;\n      }\n      flushPendingPointerMove();\n    };\n    pointer.onclose = () => {\n      if (pointerRef.current !== pointer) return;\n      pendingMoveRef.current = null;\n      if (pointerRafRef.current !== null) cancelAnimationFrame(pointerRafRef.current);\n      pointerRafRef.current = null;\n      pointerRef.current = null;\n    };\n\n    return pc;\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one integration anchor, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Web tests
        working-directory: apps/web
        run: npm test
      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "perf(input): prevent stale pointer move queue buildup"
          git push origin HEAD:main
