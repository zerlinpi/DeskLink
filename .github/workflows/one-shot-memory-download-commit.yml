name: One-shot stale memory download commit fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-memory-download-commit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Fence memory chunk commits against channel replacement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/file_transfer.ts')
          text = path.read_text(encoding='utf-8')

          old_import = 'import {\n  pauseDownloadForChannelReplacement,\n  pauseUploadForChannelReplacement,\n} from "./file_transfer_recovery";'
          new_import = 'import {\n  isDownloadChunkCommitCurrent,\n  pauseDownloadForChannelReplacement,\n  pauseUploadForChannelReplacement,\n} from "./file_transfer_recovery";'
          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_writer = 'async function writeDownloadChunk(job: DownloadJob, offset: number, payload: Uint8Array) {\n  if (job.sink.kind === "filesystem") {\n    const copy = new ArrayBuffer(payload.byteLength);\n    new Uint8Array(copy).set(payload);\n    await job.sink.writable.write({ type: "write", position: offset, data: copy });\n  } else {\n    job.sink.chunks.push(payload.slice());\n  }\n}'
          new_writer = 'async function prepareDownloadChunk(\n  job: DownloadJob,\n  offset: number,\n  payload: Uint8Array,\n): Promise<ArrayBuffer | null> {\n  const copy = new ArrayBuffer(payload.byteLength);\n  new Uint8Array(copy).set(payload);\n  if (job.sink.kind === "filesystem") {\n    await job.sink.writable.write({ type: "write", position: offset, data: copy });\n    return null;\n  }\n  return copy;\n}'
          if text.count(old_writer) != 1:
              raise SystemExit(f'writer anchor count={text.count(old_writer)}')
          text = text.replace(old_writer, new_writer, 1)

          old_commit = '  try {\n    await writeDownloadChunk(job, offset, payload);\n  } catch (error) {\n    console.debug("DeskLink local download write failed", error);\n    await failDownload(job, "写入本地文件失败");\n    return;\n  }\n\n  if (activeDownload !== job || job.token !== token) return;\n  job.received += payload.byteLength;'
          new_commit = '  let memoryChunk: ArrayBuffer | null;\n  try {\n    memoryChunk = await prepareDownloadChunk(job, offset, payload);\n  } catch (error) {\n    console.debug("DeskLink local download write failed", error);\n    await failDownload(job, "写入本地文件失败");\n    return;\n  }\n\n  if (!isDownloadChunkCommitCurrent(activeDownload, job, token)) return;\n  if (memoryChunk !== null && job.sink.kind === "memory") {\n    job.sink.chunks.push(memoryChunk);\n  }\n  job.received += payload.byteLength;'
          if text.count(old_commit) != 1:
              raise SystemExit(f'commit anchor count={text.count(old_commit)}')
          text = text.replace(old_commit, new_commit, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Commit stale memory download fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/file_transfer.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): prevent duplicate memory chunks after recovery"
          git push origin HEAD:main
