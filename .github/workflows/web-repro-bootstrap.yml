name: Web Reproducibility Bootstrap

on:
  push:
    branches: [main]
    paths:
      - apps/web/package.json
      - apps/web/vite.config.ts
      - .github/workflows/web-repro-bootstrap.yml

permissions:
  contents: read

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Generate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install from generated lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: desklink-web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
