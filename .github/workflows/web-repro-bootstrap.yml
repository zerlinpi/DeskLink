name: Web Reproducibility Bootstrap

on:
  push:
    branches: [main]
    paths:
      - apps/web/package.json
      - apps/web/vite.config.ts
      - .github/workflows/web-repro-bootstrap.yml

permissions:
  contents: read

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Generate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove non-resolution lockfile metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("package-lock.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          keep = {
              "version", "integrity", "dependencies", "devDependencies",
              "optionalDependencies", "peerDependencies", "peerDependenciesMeta",
              "dev", "optional", "link", "hasInstallScript", "os", "cpu", "bin"
          }
          for name, package in lock.get("packages", {}).items():
              if not name or not isinstance(package, dict):
                  continue
              lock["packages"][name] = {
                  key: value for key, value in package.items() if key in keep
              }
          path.write_text(
              json.dumps(lock, separators=(",", ":"), ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify clean install from compact lockfile
        run: |
          rm -rf node_modules
          npm ci
          git diff --exit-code -- package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: desklink-web-package-lock-compact
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
