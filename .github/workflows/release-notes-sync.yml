name: Release Notes Sync

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - docs/releases/**
      - tools/version/**
      - .github/workflows/release-notes-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desklink-release-notes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Resolve release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(python tools/version/check-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Development VERSION $version has no published release notes to sync."
            exit 0
          fi

          python tools/version/check-version.py --require-stable --tag "v$version" >/dev/null
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/v$version.md" >> "$GITHUB_OUTPUT"

      - name: Sync published release notes
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes="${{ steps.version.outputs.notes }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "DeskLink v${{ steps.version.outputs.version }}" \
              --notes-file "$notes"
            echo "Updated release notes for $tag"
          else
            echo "Release $tag does not exist yet; the tag-driven Release workflow will create it."
          fi
