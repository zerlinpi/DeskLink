name: One-shot signal scope integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-signal-scope-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Integrate signal scope policy into Web controller
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '} from "./session_recovery";\nimport "./styles.css";\n',
                  '} from "./session_recovery";\nimport { shouldAcceptSignalMessage } from "./signal_scope";\nimport "./styles.css";\n',
              ),
              (
                  'const HOST_SCOPED_SIGNAL_TYPES = new Set([\n  "auth-challenge",\n  "auth-accepted",\n  "auth-rejected",\n  "answer",\n  "ice",\n]);\n\n',
                  '',
              ),
              (
                  '    if (HOST_SCOPED_SIGNAL_TYPES.has(msg.type)) {\n      if (msg.from !== targetId.trim() || msg.session !== sessionRef.current) {\n        console.debug("DeskLink ignored host-scoped signal from unexpected peer/session", msg.type);\n        return;\n      }\n    }\n\n',
                  '    if (!shouldAcceptSignalMessage(msg, {\n      hostId: targetId.trim(),\n      sessionId: sessionRef.current,\n    })) {\n      console.debug("DeskLink ignored signal outside the active target/session scope", msg.type);\n      return;\n    }\n\n',
              ),
              (
                  '    if (msg.type === "device-revoked") {\n      const revokedTarget = typeof msg.target === "string" ? msg.target : "";\n      if (revokedTarget && revokedTarget !== targetId.trim()) {\n        console.debug("DeskLink ignored device-revoked for unexpected target", revokedTarget);\n        return;\n      }\n      disconnect("device revoked");\n      return;\n    }\n',
                  '    if (msg.type === "device-revoked") {\n      disconnect("device revoked");\n      return;\n    }\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one signal-scope integration anchor, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Run Web tests
        working-directory: apps/web
        run: npm test

      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor(web): enforce active signal session scope"
          git push origin HEAD:main
