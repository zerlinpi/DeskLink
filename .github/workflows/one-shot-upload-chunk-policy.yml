name: One-shot upload chunk progress hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-upload-chunk-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply upload chunk progress policy
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          receiver_path = Path('apps/windows-agent/src/file_transfer_receiver.cpp')
          receiver = receiver_path.read_text(encoding='utf-8')
          old_include = '#include "file_transfer_receiver.h"\n'
          new_include = '#include "file_transfer_receiver.h"\n#include "file_transfer_chunk_policy.h"\n'
          if receiver.count(old_include) != 1:
              raise SystemExit(f'receiver include anchor count={receiver.count(old_include)}')
          receiver = receiver.replace(old_include, new_include, 1)

          old_range = '    if (payload_size > active.expected_size - active.received) {\n      SendUploadError(active.id, "chunk-overflow");\n      return;\n    }'
          new_range = '    if (!IsValidUploadChunkProgress(payload_size, active.received, active.expected_size)) {\n      SendUploadError(active.id, payload_size == 0 ? "empty-chunk" : "chunk-overflow");\n      return;\n    }'
          if receiver.count(old_range) != 1:
              raise SystemExit(f'upload range anchor count={receiver.count(old_range)}')
          receiver_path.write_text(receiver.replace(old_range, new_range, 1), encoding='utf-8')

          cmake_path = Path('apps/windows-agent/CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          old_sources = '  src/file_transfer_receiver.cpp\n  src/file_transfer_receiver.h\n'
          new_sources = '  src/file_transfer_receiver.cpp\n  src/file_transfer_receiver.h\n  src/file_transfer_chunk_policy.h\n'
          if cmake.count(old_sources) != 1:
              raise SystemExit(f'agent source anchor count={cmake.count(old_sources)}')
          cmake = cmake.replace(old_sources, new_sources, 1)

          target_anchor = 'add_executable(desklink-active-session-smoke\n'
          target = '''add_executable(desklink-file-transfer-chunk-policy-smoke
            src/file_transfer_chunk_policy_smoke.cpp
            src/file_transfer_chunk_policy.h
          )
          target_compile_definitions(desklink-file-transfer-chunk-policy-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          target_compile_options(desklink-file-transfer-chunk-policy-smoke PRIVATE /W4 /permissive-)

          '''
          target = '\n'.join(line[10:] if line.startswith('          ') else line for line in target.splitlines())
          if cmake.count(target_anchor) != 1:
              raise SystemExit(f'smoke target anchor count={cmake.count(target_anchor)}')
          cmake_path.write_text(cmake.replace(target_anchor, target + target_anchor, 1), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "source patch failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "patched source has whitespace errors" }

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build agent and chunk policy smoke
        run: cmake --build build/windows-agent --config Release --target desklink-agent desklink-file-transfer-chunk-policy-smoke --parallel

      - name: Run upload chunk progress smoke
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-file-transfer-chunk-policy-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "File transfer chunk policy smoke failed with exit code $LASTEXITCODE" }

      - name: Commit upload chunk hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/file_transfer_receiver.cpp apps/windows-agent/CMakeLists.txt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(windows): reject zero-progress upload chunks"
          git push origin HEAD:main
