name: Deployment Smoke

on:
  push:
    branches: [main]
    paths:
      - apps/signal/**
      - apps/web/**
      - infra/production/**
      - .github/workflows/deployment-smoke.yml
  pull_request:
    branches: [main]
    paths:
      - apps/signal/**
      - apps/web/**
      - infra/production/**
      - .github/workflows/deployment-smoke.yml

concurrency:
  group: desklink-deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap shell syntax
        run: sh -n infra/production/bootstrap.sh

      - name: Validate production Compose
        run: |
          docker compose \
            --env-file infra/production/.env.example \
            -f infra/production/docker-compose.yml \
            config >/dev/null

      - name: Build production Signal and Web containers
        run: |
          docker compose \
            --env-file infra/production/.env.example \
            -f infra/production/docker-compose.yml \
            build signal web
