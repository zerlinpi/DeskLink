name: Peer signal scope contract

on:
  push:
    branches: [main]
    paths:
      - apps/windows-agent/src/peer_signal_scope.h
      - apps/windows-agent/src/peer_signal_scope_smoke.cpp
      - apps/windows-agent/src/webrtc_session.cpp
      - apps/windows-agent/CMakeLists.txt
      - .github/workflows/peer-signal-scope-contract.yml
  pull_request:
    branches: [main]
    paths:
      - apps/windows-agent/src/peer_signal_scope.h
      - apps/windows-agent/src/peer_signal_scope_smoke.cpp
      - apps/windows-agent/src/webrtc_session.cpp
      - apps/windows-agent/CMakeLists.txt
      - .github/workflows/peer-signal-scope-contract.yml

concurrency:
  group: desklink-peer-signal-scope-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-peer-signal-scope:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure peer signal scope smoke
        run: cmake -S apps/windows-agent -B build/windows-peer-signal-scope -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE
      - name: Build peer signal scope smoke
        run: cmake --build build/windows-peer-signal-scope --config Release --target desklink-peer-signal-scope-smoke --parallel
      - name: Validate stale peer/session signaling is rejected
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-peer-signal-scope/Release/desklink-peer-signal-scope-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Peer signal scope smoke failed with exit code $LASTEXITCODE"
          }
