name: Apply SAS Core

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-sas-core.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete Windows SAS core wiring
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          def replace_regex(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected 1 match, found {count}: {pattern[:100]!r}')
              p.write_text(updated, encoding='utf-8', newline='\n')

          path = 'apps/windows-agent/src/service_main.cpp'
          replace_one(path,
          '''  const bool signal_broker = credential_status == desklink::ProtectedCredentialStatus::Loaded;
            const bool access_code_broker = access_code_status == desklink::ProtectedCredentialStatus::Loaded;
            const bool broker_mode = signal_broker || access_code_broker;
            if (broker_mode && !has_environment) {''',
          '''  const bool signal_broker = credential_status == desklink::ProtectedCredentialStatus::Loaded;
            const bool access_code_broker = access_code_status == desklink::ProtectedCredentialStatus::Loaded;
            const bool secure_attention_broker = true;
            const bool protected_secret_broker = signal_broker || access_code_broker;
            const bool broker_mode = protected_secret_broker || secure_attention_broker;
            if (protected_secret_broker && !has_environment) {''')
          replace_one(path,
          '''  if (broker_mode) {
              protected_environment = BuildEnvironmentWithoutProtectedSecrets(
                  environment,
                  signal_broker,
                  access_code_broker);
              child_environment = protected_environment.data();
              auth_pipe_name = NewServiceAuthPipeName(session_id);
            }''',
          '''  if (broker_mode) {
              auth_pipe_name = NewServiceAuthPipeName(session_id);
            }
            if (protected_secret_broker) {
              protected_environment = BuildEnvironmentWithoutProtectedSecrets(
                  environment,
                  signal_broker,
                  access_code_broker);
              child_environment = protected_environment.data();
            }''')
          replace_one(path,
          '''    if (signal_broker) command += L" --service-signal-token-broker";
              if (access_code_broker) command += L" --service-access-code-broker";
            }''',
          '''    if (signal_broker) command += L" --service-signal-token-broker";
              if (access_code_broker) command += L" --service-access-code-broker";
              if (secure_attention_broker) command += L" --service-sas-broker";
            }''')
          replace_regex(
              path,
              r'(std::move\(broker_credential\),\s*\n\s*std::move\(broker_access_code\),)(\s*\n\s*)(&broker_error\);)',
              r'\1\2secure_attention_broker,\2\3')
          replace_one(path,
          '''  if (signal_broker) security_mode += L" signal-token";
            if (access_code_broker) security_mode += L" access-code";''',
          '''  if (signal_broker) security_mode += L" signal-token";
            if (access_code_broker) security_mode += L" access-code";
            if (secure_attention_broker) security_mode += L" secure-attention";''')

          path = 'apps/windows-agent/src/webrtc_session.cpp'
          replace_one(path,
              '#include "file_transfer_receiver.h"\n#include "signal_token_client.h"',
              '#include "file_transfer_receiver.h"\n#include "service_auth_client.h"\n#include "signal_token_client.h"')
          replace_one(path,
          '''  if (type == "release-all") {
              input_.ReleaseAll();
              return;
            }

            if (type == "video-profile") {''',
          '''  if (type == "release-all") {
              input_.ReleaseAll();
              return;
            }

            if (type == "system-operation") {
              const std::string request_id = event.value("requestId", "");
              const std::string operation = event.value("operation", "");
              if (!ValidRequestId(request_id)) return;

              json response = {
                  {"t", "system-operation-result"},
                  {"requestId", request_id},
                  {"operation", operation},
                  {"ok", false},
              };
              if (operation == "secure-attention-sequence") {
                input_.ReleaseAll();
                std::string sas_error;
                const bool ok = ServiceSecureAttentionBrokerConfigured() &&
                    RequestServiceSecureAttentionSequence(&sas_error);
                response["ok"] = ok;
                if (!ok) {
                  response["error"] = sas_error.empty()
                      ? "Secure Attention Sequence is unavailable on this host"
                      : sas_error;
                }
              } else {
                response["error"] = "unsupported system operation";
              }
              SendControlMessage(response.dump());
              return;
            }

            if (type == "video-profile") {''')

          path = 'apps/windows-agent/src/service_auth_broker_smoke.cpp'
          replace_regex(
              path,
              r'  if \(!desklink::ServiceSignalTokenBrokerConfigured\(\) \|\|\s*!desklink::ServiceAccessCodeBrokerConfigured\(\)\) \{',
              '''  if (!desklink::ServiceSignalTokenBrokerConfigured() ||
              !desklink::ServiceAccessCodeBrokerConfigured() ||
              !desklink::ServiceSecureAttentionBrokerConfigured()) {''')
          replace_one(path,
              '--service-signal-token-broker --service-access-code-broker',
              '--service-signal-token-broker --service-access-code-broker --service-sas-broker')
          replace_regex(
              path,
              r'(kDeviceCredential,\s*\n\s*kExpectedAccessCode,)(\s*\n\s*)(&broker_error\)\))',
              r'\1\2true,\2\3')
          replace_one(path,
              'Service auth broker Signal Token + access-code smoke test passed',
              'Service auth broker Signal Token + access-code + SAS capability smoke test passed')

          path = 'apps/windows-agent/CMakeLists.txt'
          replace_one(path,
          '''  src/service_auth_client.cpp
            src/service_auth_client.h
            src/signal_token_client.cpp
            src/signal_token_client.h
            "${CMAKE_CURRENT_BINARY_DIR}/desklink-service-version.rc"''',
          '''  src/service_auth_client.cpp
            src/service_auth_client.h
            src/secure_attention.cpp
            src/secure_attention.h
            src/signal_token_client.cpp
            src/signal_token_client.h
            "${CMAKE_CURRENT_BINARY_DIR}/desklink-service-version.rc"''')
          replace_one(path,
          '''  src/service_auth_client.cpp
            src/service_auth_client.h
            src/signal_token_client.cpp
            src/signal_token_client.h
          )
          target_compile_definitions(desklink-service-auth-smoke''',
          '''  src/service_auth_client.cpp
            src/service_auth_client.h
            src/secure_attention.cpp
            src/secure_attention.h
            src/signal_token_client.cpp
            src/signal_token_client.h
          )
          target_compile_definitions(desklink-service-auth-smoke''')
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          marker = 'target_link_libraries(desklink-device-identity-smoke PRIVATE advapi32 bcrypt)'
          if text.count(marker) != 1:
              raise SystemExit('device identity smoke marker mismatch')
          addition = '''

          add_executable(desklink-secure-attention-smoke
            src/secure_attention_smoke.cpp
            src/secure_attention.cpp
            src/secure_attention.h
          )
          target_compile_definitions(desklink-secure-attention-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          target_compile_options(desklink-secure-attention-smoke PRIVATE /W4 /permissive-)
          target_link_libraries(desklink-secure-attention-smoke PRIVATE advapi32)'''
          p.write_text(text.replace(marker, marker + addition), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Run SAS and regression smokes
        shell: pwsh
        run: |
          foreach ($smokePath in @(
            "build/windows-agent/Release/desklink-secure-attention-smoke.exe",
            "build/windows-agent/Release/desklink-device-identity-smoke.exe",
            "build/windows-agent/Release/desklink-service-auth-smoke.exe",
            "build/windows-agent/Release/desklink-active-session-smoke.exe",
            "build/windows-agent/Release/desklink-video-policy-smoke.exe",
            "build/windows-agent/Release/desklink-h264-annexb-smoke.exe",
            "build/windows-agent/Release/desklink-access-proof-smoke.exe"
          )) {
            & (Resolve-Path $smokePath)
            if ($LASTEXITCODE -ne 0) { throw "$smokePath failed with exit code $LASTEXITCODE" }
          }
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          $first = (& $service --print-default-device-id | Select-Object -Last 1).Trim()
          $second = (& $service --print-default-device-id | Select-Object -Last 1).Trim()
          if ($first -notmatch '^win-[0-9a-f]{32}$' -or $first -ne $second) {
            throw "Service default Device ID was not stable: '$first' / '$second'"
          }

      - name: Commit validated SAS core
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sas-core.yml
          git add apps/windows-agent/CMakeLists.txt apps/windows-agent/src/service_main.cpp apps/windows-agent/src/webrtc_session.cpp apps/windows-agent/src/service_auth_broker_smoke.cpp
          git commit -m "feat(windows): route Ctrl+Alt+Del through Service SAS broker"
          git pull --rebase origin main
          git push origin HEAD:main
