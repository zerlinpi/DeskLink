name: One-shot stale access proof guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-stale-proof.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Bind async signal callbacks to socket and session scope
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          recovery_path = Path('apps/web/src/session_recovery.ts')
          recovery = recovery_path.read_text(encoding='utf-8')
          type_anchor = '''export type SignalOpenScope = {\n  manualDisconnect: boolean;\n  expectedSession: string;\n  currentSession: string;\n  expectedTarget: string;\n  currentTarget: string;\n};\n'''
          type_insert = type_anchor + '''\nexport type SignalCallbackScope = SignalOpenScope & {\n  sourceSocketCurrent: boolean;\n};\n'''
          if recovery.count(type_anchor) != 1:
              raise SystemExit(f'SignalOpenScope anchor count={recovery.count(type_anchor)}')
          recovery = recovery.replace(type_anchor, type_insert, 1)

          function_anchor = '''export function isSignalOpenScopeCurrent(scope: SignalOpenScope): boolean {\n  return !scope.manualDisconnect &&\n    scope.expectedSession === scope.currentSession &&\n    scope.expectedTarget === scope.currentTarget;\n}\n'''
          function_insert = function_anchor + '''\nexport function isSignalCallbackScopeCurrent(scope: SignalCallbackScope): boolean {\n  return scope.sourceSocketCurrent && isSignalOpenScopeCurrent(scope);\n}\n'''
          if recovery.count(function_anchor) != 1:
              raise SystemExit(f'isSignalOpenScopeCurrent anchor count={recovery.count(function_anchor)}')
          recovery_path.write_text(recovery.replace(function_anchor, function_insert, 1), encoding='utf-8')

          test_path = Path('apps/web/src/session_recovery.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = '''  iceRestartDelayMs,\n  isSignalOpenScopeCurrent,\n'''
          import_new = '''  iceRestartDelayMs,\n  isSignalCallbackScopeCurrent,\n  isSignalOpenScopeCurrent,\n'''
          if test.count(import_anchor) != 1:
              raise SystemExit(f'recovery test import anchor count={test.count(import_anchor)}')
          test = test.replace(import_anchor, import_new, 1)

          test_anchor = '''  it("rejects stale async opens after disconnect, session rotation, or target change", () => {\n    const current = {\n      manualDisconnect: false,\n      expectedSession: "session-a",\n      currentSession: "session-a",\n      expectedTarget: "host-a",\n      currentTarget: "host-a",\n    } as const;\n    expect(isSignalOpenScopeCurrent(current)).toBe(true);\n    expect(isSignalOpenScopeCurrent({ ...current, manualDisconnect: true })).toBe(false);\n    expect(isSignalOpenScopeCurrent({ ...current, currentSession: "session-b" })).toBe(false);\n    expect(isSignalOpenScopeCurrent({ ...current, currentTarget: "host-b" })).toBe(false);\n  });\n'''
          test_insert = test_anchor + '''\n  it("rejects async signal callbacks after their source socket is replaced", () => {\n    const current = {\n      manualDisconnect: false,\n      expectedSession: "session-a",\n      currentSession: "session-a",\n      expectedTarget: "host-a",\n      currentTarget: "host-a",\n      sourceSocketCurrent: true,\n    } as const;\n    expect(isSignalCallbackScopeCurrent(current)).toBe(true);\n    expect(isSignalCallbackScopeCurrent({ ...current, sourceSocketCurrent: false })).toBe(false);\n    expect(isSignalCallbackScopeCurrent({ ...current, currentSession: "session-b" })).toBe(false);\n    expect(isSignalCallbackScopeCurrent({ ...current, currentTarget: "host-b" })).toBe(false);\n    expect(isSignalCallbackScopeCurrent({ ...current, manualDisconnect: true })).toBe(false);\n  });\n'''
          if test.count(test_anchor) != 1:
              raise SystemExit(f'recovery test case anchor count={test.count(test_anchor)}')
          test_path.write_text(test.replace(test_anchor, test_insert, 1), encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          import_anchor = '''  hostWaitRefreshDelayMs,\n  iceRestartDelayMs,\n  isSignalOpenScopeCurrent,\n'''
          import_new = '''  hostWaitRefreshDelayMs,\n  iceRestartDelayMs,\n  isSignalCallbackScopeCurrent,\n  isSignalOpenScopeCurrent,\n'''
          if main.count(import_anchor) != 1:
              raise SystemExit(f'main recovery import anchor count={main.count(import_anchor)}')
          main = main.replace(import_anchor, import_new, 1)

          handler_anchor = '''  const handleSignalMessage = async (event: MessageEvent) => {\n    let msg: SignalMessage;\n'''
          handler_new = '''  const handleSignalMessage = async (event: MessageEvent, sourceSocket: WebSocket) => {\n    const expectedSession = sessionRef.current;\n    const expectedTarget = targetId.trim();\n    const callbackScopeCurrent = () => isSignalCallbackScopeCurrent({\n      manualDisconnect: manualDisconnectRef.current,\n      sourceSocketCurrent: wsRef.current === sourceSocket,\n      expectedSession,\n      currentSession: sessionRef.current,\n      expectedTarget,\n      currentTarget: targetId.trim(),\n    });\n    if (!callbackScopeCurrent()) return;\n\n    let msg: SignalMessage;\n'''
          if main.count(handler_anchor) != 1:
              raise SystemExit(f'handleSignalMessage anchor count={main.count(handler_anchor)}')
          main = main.replace(handler_anchor, handler_new, 1)

          proof_anchor = '''        const proof = await createAccessProof(\n          accessCode,\n          localId,\n          targetId.trim(),\n          sessionRef.current,\n          nonce,\n        );\n        if (manualDisconnectRef.current) return;\n        if (!sendSignal("auth-proof", { algorithm, proof })) {\n          disconnect("host authentication signaling failed");\n        }\n      } catch (error) {\n        console.debug("DeskLink host access proof failed", error);\n        disconnect("host access authentication failed");\n      }\n'''
          proof_new = '''        const proof = await createAccessProof(\n          accessCode,\n          localId,\n          expectedTarget,\n          expectedSession,\n          nonce,\n        );\n        if (!callbackScopeCurrent()) return;\n        if (!sendSignal("auth-proof", { algorithm, proof })) {\n          disconnect("host authentication signaling failed");\n        }\n      } catch (error) {\n        if (!callbackScopeCurrent()) return;\n        console.debug("DeskLink host access proof failed", error);\n        disconnect("host access authentication failed");\n      }\n'''
          if main.count(proof_anchor) != 1:
              raise SystemExit(f'access proof anchor count={main.count(proof_anchor)}')
          main = main.replace(proof_anchor, proof_new, 1)

          onmessage_anchor = '''    ws.onmessage = (event) => {\n      void handleSignalMessage(event);\n    };\n'''
          onmessage_new = '''    ws.onmessage = (event) => {\n      void handleSignalMessage(event, ws);\n    };\n'''
          if main.count(onmessage_anchor) != 1:
              raise SystemExit(f'ws.onmessage anchor count={main.count(onmessage_anchor)}')
          main_path.write_text(main.replace(onmessage_anchor, onmessage_new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Validate Web controller
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Commit, rebase and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/session_recovery.ts apps/web/src/session_recovery.test.ts
          git diff --cached --check
          git commit -m "fix(web): drop stale access proof callbacks"
          git fetch origin main
          git rebase origin/main
          pushd apps/web
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          popd
          git push origin HEAD:main
