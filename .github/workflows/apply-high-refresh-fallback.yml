name: Apply High Refresh Fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-high-refresh-fallback.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply encoder fallback patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("apps/windows-agent/src/main.cpp")
          text = path.read_text(encoding="utf-8")

          old_fps = '  const uint32_t target_fps = EnvUIntOr("DESKLINK_FPS", 60, 15, 144);'
          new_fps = '  uint32_t target_fps = EnvUIntOr("DESKLINK_FPS", 60, 15, 144);'
          if text.count(old_fps) != 1:
              raise SystemExit(f"target_fps declaration mismatch: {text.count(old_fps)}")
          text = text.replace(old_fps, new_fps)

          start_marker = "  desklink::GpuColorConverter converter;\n"
          end_marker = "\n  if (!converter_ready) {"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("video pipeline initialization boundaries are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              "  desklink::GpuColorConverter converter;\n"
              "  desklink::H264Encoder encoder;\n"
              "  bool converter_ready = false;\n"
              "  bool encoder_ready = false;\n\n"
              "  auto initialize_video_pipeline_at_fps = [&](uint32_t fps) {\n"
              "    encoder.Reset();\n"
              "    converter.Reset();\n"
              "    converter_ready = converter.Initialize(\n"
              "        device.Get(),\n"
              "        source_width,\n"
              "        source_height,\n"
              "        encode_size.width,\n"
              "        encode_size.height,\n"
              "        fps);\n"
              "    encoder_ready = converter_ready && encoder.Initialize(\n"
              "        device.Get(),\n"
              "        encode_size.width,\n"
              "        encode_size.height,\n"
              "        fps,\n"
              "        target_bitrate);\n"
              "    return encoder_ready;\n"
              "  };\n\n"
              "  const uint32_t requested_target_fps = target_fps;\n"
              "  initialize_video_pipeline_at_fps(target_fps);\n"
              "  while (!encoder_ready && target_fps > 60) {\n"
              "    const uint32_t fallback_fps = desklink::LowerFpsTier(target_fps, target_fps);\n"
              "    if (fallback_fps >= target_fps) break;\n"
              "    std::wcerr << L\"Video pipeline unavailable at \" << target_fps\n"
              "               << L\" fps; retrying \" << fallback_fps << L\" fps.\\n\";\n"
              "    target_fps = fallback_fps;\n"
              "    initialize_video_pipeline_at_fps(target_fps);\n"
              "  }\n"
              "  if (encoder_ready && target_fps != requested_target_fps) {\n"
              "    std::wcout << L\"High-refresh compatibility fallback selected \" << target_fps\n"
              "               << L\" fps instead of requested \" << requested_target_fps << L\" fps.\\n\";\n"
              "  }\n"
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Validate high-refresh policy smoke
        shell: pwsh
        run: |
          & "build/windows-agent/Release/desklink-video-policy-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "High-refresh policy smoke failed with exit code $LASTEXITCODE" }

      - name: Commit validated fallback to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/main.cpp
          if (git diff --cached --quiet) { throw "High-refresh fallback patch produced no changes" }
          git commit -m "fix(windows): fall back when high-refresh encoder init fails"
          git pull --rebase origin main
          git push origin HEAD:main
