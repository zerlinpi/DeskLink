name: One-shot browser control RTT telemetry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-rtt-web.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Integrate browser control RTT telemetry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (
              'import { decodeControlChannelText } from "./control_channel_message";\n',
              'import { decodeControlChannelText } from "./control_channel_message";\nimport { resolveControlRttAck, shouldIssueControlRttProbe, type PendingControlRttProbe } from "./control_rtt";\n',
            ),
            (
              '  rttMs: number | null;\n  lossPct: number;\n',
              '  rttMs: number | null;\n  controlRttMs: number | null;\n  lossPct: number;\n',
            ),
            (
              '  rttMs: null,\n  lossPct: 0,\n',
              '  rttMs: null,\n  controlRttMs: null,\n  lossPct: 0,\n',
            ),
            (
              '  const statsBaselineRef = useRef<StatsBaseline | null>(null);\n  const telemetryAttemptRef = useRef(new AsyncAttemptCoordinator());\n',
              '  const statsBaselineRef = useRef<StatsBaseline | null>(null);\n  const controlRttProbeRef = useRef<PendingControlRttProbe | null>(null);\n  const telemetryAttemptRef = useRef(new AsyncAttemptCoordinator());\n',
            ),
            (
              '  const sendReliable = (payload: object) => {\n    const channel = controlRef.current;\n    if (channel?.readyState === "open") channel.send(JSON.stringify(payload));\n  };\n\n',
              '  const sendReliable = (payload: object) => {\n    const channel = controlRef.current;\n    if (channel?.readyState === "open") channel.send(JSON.stringify(payload));\n  };\n\n  const sendControlRttProbe = (channel: RTCDataChannel) => {\n    if (channel.readyState !== "open" || controlRef.current !== channel) return;\n    const nowMs = performance.now();\n    const pending = controlRttProbeRef.current;\n    if (!shouldIssueControlRttProbe(pending, nowMs)) return;\n    if (pending) {\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));\n    }\n    const requestId = crypto.randomUUID();\n    try {\n      channel.send(JSON.stringify({ t: "control-rtt-probe", requestId }));\n      controlRttProbeRef.current = { requestId, sentAtMs: nowMs };\n    } catch (error) {\n      console.debug("DeskLink control RTT probe send failed", error);\n    }\n  };\n\n',
            ),
            (
              '      if (!resourcesCurrent()) return;\n      const report = await pc.getStats();\n',
              '      if (!resourcesCurrent()) return;\n      sendControlRttProbe(control);\n      const report = await pc.getStats();\n',
            ),
            (
              '      setNetworkView({\n        route,\n        protocol,\n        rttMs,\n        lossPct,\n        jitterMs,\n        decodeFps,\n        availableIncomingBitrate,\n      });\n',
              '      setNetworkView((current) => ({\n        route,\n        protocol,\n        rttMs,\n        controlRttMs: current.controlRttMs,\n        lossPct,\n        jitterMs,\n        decodeFps,\n        availableIncomingBitrate,\n      }));\n',
            ),
            (
              '      setStatus(wsRef.current?.readyState === WebSocket.OPEN\n        ? "control ready"\n        : "control ready · signaling reconnecting");\n      startTelemetry(pc);\n',
              '      setStatus(wsRef.current?.readyState === WebSocket.OPEN\n        ? "control ready"\n        : "control ready · signaling reconnecting");\n      controlRttProbeRef.current = null;\n      sendControlRttProbe(control);\n      startTelemetry(pc);\n',
            ),
            (
              '      if (decoded.kind === "host-capabilities") {\n        setHostCapabilities(decoded.capabilities);\n      } else if (decoded.kind === "invalid" && event.data.includes(\'"t":"host-capabilities"\')) {\n',
              '      if (decoded.kind === "host-capabilities") {\n        setHostCapabilities(decoded.capabilities);\n      } else if (decoded.kind === "control-rtt-ack") {\n        const measured = resolveControlRttAck(\n          controlRttProbeRef.current,\n          decoded.requestId,\n          performance.now(),\n        );\n        if (measured !== null) {\n          controlRttProbeRef.current = null;\n          setNetworkView((current) => ({ ...current, controlRttMs: measured }));\n        }\n      } else if (decoded.kind === "invalid" && event.data.includes(\'"t":"host-capabilities"\')) {\n',
            ),
            (
              '      stopTelemetry();\n      setHostCapabilities(null);\n',
              '      stopTelemetry();\n      controlRttProbeRef.current = null;\n      setNetworkView((current) => ({ ...current, controlRttMs: null }));\n      setHostCapabilities(null);\n',
            ),
            (
              '    resetDataChannelRecoveryState();\n    iceRestartInFlightRef.current = false;\n',
              '    resetDataChannelRecoveryState();\n    controlRttProbeRef.current = null;\n    iceRestartInFlightRef.current = false;\n',
            ),
            (
              '            <span>RTT {networkView.rttMs == null ? "-" : `${networkView.rttMs.toFixed(0)} ms`}</span>\n            <span>Loss {networkView.lossPct.toFixed(1)}%</span>\n',
              '            <span>RTT {networkView.rttMs == null ? "-" : `${networkView.rttMs.toFixed(0)} ms`}</span>\n            <span>Control RTT {networkView.controlRttMs == null ? "-" : `${networkView.controlRttMs.toFixed(0)} ms`}</span>\n            <span>Loss {networkView.lossPct.toFixed(1)}%</span>\n',
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count={count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - name: Typecheck Web controller
        working-directory: apps/web
        run: npm run typecheck
      - name: Run Web tests
        working-directory: apps/web
        run: npm test
      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit browser integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): measure control channel application RTT"
          git push origin HEAD:main
