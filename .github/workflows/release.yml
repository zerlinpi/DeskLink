name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desklink-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python tools/version/check-version.py --require-stable --tag "${GITHUB_REF_NAME}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test and build signaling service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          pushd apps/signal
          go mod download
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.buildVersion=${{ steps.version.outputs.version }}" \
            -o "../../release/desklink-signal-v${{ steps.version.outputs.version }}-linux-amd64" .
          popd

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate and package browser controller
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/web
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          popd

          version="${{ steps.version.outputs.version }}"

          dist_stage="release/web-dist"
          mkdir -p "$dist_stage"
          cp -R apps/web/dist/. "$dist_stage/"
          cp packaging/web/README.txt "$dist_stage/README.txt"
          tar -czf "release/desklink-web-v${version}-dist.tar.gz" -C "$dist_stage" .

          source_stage="release/web-source"
          mkdir -p "$source_stage/app/src" "$source_stage/app/public" "$source_stage/app/scripts"
          cp apps/web/index.html "$source_stage/app/"
          cp apps/web/package.json "$source_stage/app/"
          cp apps/web/package-lock.json "$source_stage/app/"
          cp apps/web/tsconfig.json "$source_stage/app/"
          cp apps/web/vite.config.ts "$source_stage/app/"
          cp apps/web/.env.restrictive.example "$source_stage/app/"
          cp apps/web/Dockerfile "$source_stage/app/"
          cp apps/web/nginx.conf "$source_stage/app/"
          cp -R apps/web/src/. "$source_stage/app/src/"
          cp -R apps/web/public/. "$source_stage/app/public/"
          cp -R apps/web/scripts/. "$source_stage/app/scripts/"
          cp packaging/web/README.txt "$source_stage/README.txt"
          tar -czf "release/desklink-web-v${version}-source.tar.gz" -C "$source_stage" .

          rm -rf "$dist_stage" "$source_stage"

      - name: Create server/web checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            "desklink-signal-v${{ steps.version.outputs.version }}-linux-amd64" \
            "desklink-web-v${{ steps.version.outputs.version }}-dist.tar.gz" \
            "desklink-web-v${{ steps.version.outputs.version }}-source.tar.gz" \
            > SHA256SUMS.server-web.txt

      - uses: actions/upload-artifact@v4
        with:
          name: desklink-release-server-web-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/desklink-signal-v${{ steps.version.outputs.version }}-linux-amd64
            release/desklink-web-v${{ steps.version.outputs.version }}-dist.tar.gz
            release/desklink-web-v${{ steps.version.outputs.version }}-source.tar.gz
            release/SHA256SUMS.server-web.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Validate release tag and version
        shell: pwsh
        run: |
          $version = python tools/version/check-version.py --require-stable --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "release version validation failed" }
          $version = ($version | Select-Object -Last 1).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "packaging/windows/install-service.ps1",
            "packaging/windows/uninstall-service.ps1",
            "packaging/windows/sign-binaries.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join "; "
              throw "$script has PowerShell syntax errors: $messages"
            }
          }

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Validate static OpenSSL selection
        shell: pwsh
        run: |
          $cache = Get-Content "build/windows-agent/CMakeCache.txt" -Raw
          if ($cache -match '(?im)^OPENSSL_(CRYPTO|SSL)_LIBRARY[^=]*=.*[\\/]MDd?[\\/]') {
            throw "CMake selected an OpenSSL /MD library instead of the portable /MT/static variant"
          }

      - name: Build Windows release
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Run native release smoke tests
        shell: pwsh
        run: |
          $smokes = @(
            "build/windows-agent/Release/desklink-h264-annexb-smoke.exe",
            "build/windows-agent/Release/desklink-video-policy-smoke.exe",
            "build/windows-agent/Release/desklink-active-session-smoke.exe",
            "build/windows-agent/Release/desklink-device-identity-smoke.exe",
            "build/windows-agent/Release/desklink-secure-attention-smoke.exe",
            "build/windows-agent/Release/desklink-host-capabilities-smoke.exe",
            "build/windows-agent/Release/desklink-access-proof-smoke.exe",
            "build/windows-agent/Release/desklink-service-auth-smoke.exe"
          )
          foreach ($smokePath in $smokes) {
            $smoke = Resolve-Path $smokePath
            & $smoke
            if ($LASTEXITCODE -ne 0) { throw "$smokePath failed with exit code $LASTEXITCODE" }
          }

      - name: Validate DPAPI protected secrets
        shell: pwsh
        run: |
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          "dc2.RELEASE_DPAPI_SMOKE_0123456789" | & $service --store-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI device credential smoke failed" }
          "Release-Access-Code-Smoke-0123456789!" | & $service --store-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access code smoke failed" }
          & $service --clear-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access code cleanup failed" }
          & $service --clear-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI device credential cleanup failed" }

      - name: Validate portable Windows dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual C++ build tools installation was not found" }
          $dumpbin = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }

          $forbidden = '(?im)^\s*(VCRUNTIME[^\s]*\.dll|MSVCP[^\s]*\.dll|libcrypto[^\s]*\.dll|libssl[^\s]*\.dll|datachannel[^\s]*\.dll)\s*$'
          foreach ($binary in @(
            "build/windows-agent/Release/DeskLink.exe",
            "build/windows-agent/Release/desklink-agent.exe",
            "build/windows-agent/Release/desklink-service.exe",
            "build/windows-agent/Release/desklink-media-probe.exe"
          )) {
            if (-not (Test-Path $binary)) { throw "missing artifact binary: $binary" }
            $dependencyText = (& $dumpbin.FullName /DEPENDENTS $binary) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            if ($dependencyText -match $forbidden) {
              throw "$binary has an external runtime dependency that must be bundled or statically linked"
            }
          }

      - name: Authenticode sign stable Windows binaries
        shell: pwsh
        env:
          DESKLINK_WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          DESKLINK_WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          DESKLINK_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          ./packaging/windows/sign-binaries.ps1 -BinaryDirectory "build/windows-agent/Release" -RequireSignature

      - name: Verify stable Authenticode signatures before packaging
        shell: pwsh
        run: |
          ./packaging/windows/sign-binaries.ps1 -BinaryDirectory "build/windows-agent/Release" -RequireSignature -VerifyOnly

      - name: Package Windows host
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageRoot = Join-Path $PWD "release\desklink-windows-v$version-x64"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item "build/windows-agent/Release/DeskLink.exe" $packageRoot
          Copy-Item "build/windows-agent/Release/desklink-agent.exe" $packageRoot
          Copy-Item "build/windows-agent/Release/desklink-service.exe" $packageRoot
          Copy-Item "build/windows-agent/Release/desklink-media-probe.exe" $packageRoot
          Copy-Item "packaging/windows/install-service.ps1" $packageRoot
          Copy-Item "packaging/windows/uninstall-service.ps1" $packageRoot
          Copy-Item "packaging/windows/README.txt" $packageRoot
          Copy-Item "docs/WINDOWS_SERVICE.md" $packageRoot

          $zip = Join-Path $PWD "release\desklink-windows-v$version-x64.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "release\SHA256SUMS.windows.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: desklink-release-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/desklink-windows-v${{ steps.version.outputs.version }}-x64.zip
            release/SHA256SUMS.windows.txt

  publish:
    needs: [server-web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python tools/version/check-version.py --require-stable --tag "${GITHUB_REF_NAME}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: desklink-release-*-${{ steps.version.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Consolidate checksums
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/SHA256SUMS.server-web.txt release-assets/SHA256SUMS.windows.txt \
            > release-assets/SHA256SUMS.txt
          rm release-assets/SHA256SUMS.server-web.txt release-assets/SHA256SUMS.windows.txt
          cat release-assets/SHA256SUMS.txt

      - name: Publish or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing notes and assets."
            gh release edit "$tag" \
              --title "DeskLink v$version" \
              --notes-file "docs/releases/v$version.md"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" \
              --verify-tag \
              --title "DeskLink v$version" \
              --notes-file "docs/releases/v$version.md" \
              release-assets/*
          fi
