name: Apply Manager FPS Setting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-manager-fps.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply manager FPS patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count} for {old[:90]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          path = "apps/windows-agent/src/setup_main.cpp"
          replace_exact(
              path,
              'constexpr int kCopyDiagnosticsButton = 1016;',
              'constexpr int kCopyDiagnosticsButton = 1016;\nconstexpr int kFps = 1017;',
          )
          replace_exact(
              path,
              '  std::wstring device_credential = GetControlText(window, kDeviceCredential);',
              '  std::wstring device_credential = GetControlText(window, kDeviceCredential);\n  std::wstring fps_text = GetControlText(window, kFps);',
          )
          replace_exact(
              path,
              '''  if (parsed_port < 1 || parsed_port > 65535) {
            cleanup();
            ShowError(window, L"TURN 端口必须是 1–65535。");
            return;
          }
          ''',
              '''  if (parsed_port < 1 || parsed_port > 65535) {
            cleanup();
            ShowError(window, L"TURN 端口必须是 1–65535。");
            return;
          }
          int parsed_fps = 0;
          try {
            parsed_fps = std::stoi(fps_text.empty() ? L"60" : fps_text);
          } catch (...) {
            parsed_fps = 0;
          }
          if (parsed_fps < 15 || parsed_fps > 144) {
            cleanup();
            ShowError(window, L"目标帧率必须是 15–144 FPS。普通办公建议 60；高刷设备可使用 90 / 120 / 144。");
            return;
          }
          ''',
          )
          replace_exact(
              path,
              '      {L"DESKLINK_TURN_CREDENTIALS_URL", turn_credentials_url},\n      {L"DESKLINK_OUTPUT_INDEX", L"0"},',
              '      {L"DESKLINK_TURN_CREDENTIALS_URL", turn_credentials_url},\n      {L"DESKLINK_OUTPUT_INDEX", L"0"},\n      {L"DESKLINK_FPS", std::to_wstring(parsed_fps)},',
          )
          replace_exact(
              path,
              '  SetControlText(window, kDeviceId, from_env(L"DESKLINK_DEVICE_ID", DefaultDeviceId().c_str()));',
              '  SetControlText(window, kDeviceId, from_env(L"DESKLINK_DEVICE_ID", DefaultDeviceId().c_str()));\n  SetControlText(window, kFps, from_env(L"DESKLINK_FPS", L"60"));',
          )
          replace_exact(
              path,
              '''  AddLabel(window, L"设备凭证", label_x, y + 5, 150);
            AddEdit(window, kDeviceCredential, edit_x, y, edit_width, L"启用信令鉴权时填写 dc2...；留空保留", true);

            HWND hint = CreateWindowExW(''',
              '''  AddLabel(window, L"设备凭证", label_x, y + 5, 150);
            AddEdit(window, kDeviceCredential, edit_x, y, edit_width, L"启用信令鉴权时填写 dc2...；留空保留", true);
            y += row;
            AddLabel(window, L"目标帧率 FPS", label_x, y + 5, 150);
            AddEdit(window, kFps, edit_x, y, edit_width, L"60（可选 90 / 120 / 144）");

            HWND hint = CreateWindowExW(''',
          )
          replace_exact(path, '      730,\n      850,', '      730,\n      900,')
          '@ | python -

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows manager and host
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Commit validated FPS setting to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/setup_main.cpp
          if (git diff --cached --quiet) { throw "Manager FPS patch produced no changes" }
          git commit -m "feat(windows): expose high-refresh setting in manager"
          git pull --rebase origin main
          git push origin HEAD:main
