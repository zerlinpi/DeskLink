name: One-shot H264 encoder full candidate transaction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-h264-full-candidate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply full H264 candidate configuration transaction
        run: |
          python tools/ci/integrate-h264-full-candidate.py
          git diff --check

      - name: Validate transaction source invariants
        shell: bash
        run: |
          set -euo pipefail
          cpp="apps/windows-agent/src/h264_encoder.cpp"
          header="apps/windows-agent/src/h264_encoder.h"
          for required in \
            BuildH264OutputMediaType \
            BuildNv12InputMediaType \
            ConfigureCandidateCodecApi \
            'reject(L"SetOutputType"' \
            'reject(L"SetInputType(NV12)"' \
            'reject(L"GetOutputStreamInfo"' \
            'reject(L"BEGIN_STREAMING"' \
            'reject(L"START_OF_STREAM"' \
            'output_stream_info_ = selected_encoder.output_stream_info'; do
            grep -Fq "$required" "$cpp" || { echo "missing invariant: $required" >&2; exit 1; }
          done
          if grep -Fq 'H264Encoder::ConfigureCodecApi' "$cpp" || grep -Fq 'ConfigureCodecApi(uint32_t bitrate_bps)' "$header"; then
            echo "legacy member codec configuration path remains" >&2
            exit 1
          fi
          test "$(grep -Fc 'MFT_MESSAGE_NOTIFY_BEGIN_STREAMING' "$cpp")" -eq 1
          test "$(grep -Fc 'MFT_MESSAGE_SET_D3D_MANAGER' "$cpp")" -eq 1

      - name: Ensure main has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          test "$remote" = "$GITHUB_SHA" || {
            echo "main advanced while integration was running; refusing stale write" >&2
            exit 1
          }

      - name: Commit full candidate transaction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/ci/integrate-h264-full-candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/h264_encoder.cpp apps/windows-agent/src/h264_encoder.h tools/ci/integrate-h264-full-candidate.py
          git diff --cached --check
          git commit -m "fix(windows): retry fully configured H264 encoder candidates"
          git push origin HEAD:main
