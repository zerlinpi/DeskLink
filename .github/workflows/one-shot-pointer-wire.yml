name: One-shot binary pointer fast path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pointer-wire.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply compact pointer wire protocol
        run: python tools/apply-pointer-wire.py

      - name: Validate source diff
        shell: bash
        run: git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Typecheck Web
        working-directory: apps/web
        run: npm run typecheck

      - name: Test Web
        working-directory: apps/web
        run: npm test

      - name: Build Web
        working-directory: apps/web
        run: npm run build

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/pointer-wire -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows agent and pointer smoke
        run: cmake --build build/pointer-wire --config Release --target desklink-agent desklink-pointer-wire-smoke --parallel

      - name: Run pointer wire smoke
        shell: pwsh
        run: |
          & "build/pointer-wire/Release/desklink-pointer-wire-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Pointer wire smoke failed with exit code $LASTEXITCODE" }

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/windows-agent/CMakeLists.txt apps/windows-agent/src/webrtc_session.cpp
          git diff --cached --check
          git commit -m "perf(input): add compact binary pointer fast path"
          git push origin HEAD:main
