name: One-shot binary pointer fast path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pointer-wire.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply compact pointer wire protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > apps/web/src/pointer_wire.ts <<'EOF'
          const MAGIC = 0xd1;
          const VERSION = 1;
          const OP_MOVE = 1;
          const OP_WHEEL = 2;

          function clampUnit(value: number): number {
            if (!Number.isFinite(value)) return 0;
            return Math.max(0, Math.min(1, value));
          }

          function quantizeUnit(value: number): number {
            return Math.round(clampUnit(value) * 0xffff);
          }

          export function encodePointerMove(x: number, y: number): ArrayBuffer {
            const buffer = new ArrayBuffer(7);
            const view = new DataView(buffer);
            view.setUint8(0, MAGIC);
            view.setUint8(1, VERSION);
            view.setUint8(2, OP_MOVE);
            view.setUint16(3, quantizeUnit(x), true);
            view.setUint16(5, quantizeUnit(y), true);
            return buffer;
          }

          export function encodePointerWheel(delta: number): ArrayBuffer {
            const buffer = new ArrayBuffer(5);
            const view = new DataView(buffer);
            const rounded = Number.isFinite(delta) ? Math.round(delta) : 0;
            const clamped = Math.max(-0x8000, Math.min(0x7fff, rounded));
            view.setUint8(0, MAGIC);
            view.setUint8(1, VERSION);
            view.setUint8(2, OP_WHEEL);
            view.setInt16(3, clamped, true);
            return buffer;
          }
          EOF

          cat > apps/web/src/pointer_wire.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { encodePointerMove, encodePointerWheel } from "./pointer_wire";

          describe("pointer binary wire protocol", () => {
            it("encodes normalized pointer coordinates in seven bytes", () => {
              expect([...new Uint8Array(encodePointerMove(0, 1))]).toEqual([
                0xd1, 1, 1, 0x00, 0x00, 0xff, 0xff,
              ]);
              expect([...new Uint8Array(encodePointerMove(0.5, 0.25))]).toEqual([
                0xd1, 1, 1, 0x00, 0x80, 0x00, 0x40,
              ]);
            });

            it("clamps invalid or out-of-range coordinates", () => {
              expect([...new Uint8Array(encodePointerMove(-2, 9))].slice(3)).toEqual([
                0x00, 0x00, 0xff, 0xff,
              ]);
              expect([...new Uint8Array(encodePointerMove(Number.NaN, Number.POSITIVE_INFINITY))].slice(3)).toEqual([
                0x00, 0x00, 0x00, 0x00,
              ]);
            });

            it("encodes wheel deltas as signed little-endian int16", () => {
              expect([...new Uint8Array(encodePointerWheel(120))]).toEqual([
                0xd1, 1, 2, 0x78, 0x00,
              ]);
              expect([...new Uint8Array(encodePointerWheel(-600))]).toEqual([
                0xd1, 1, 2, 0xa8, 0xfd,
              ]);
              expect([...new Uint8Array(encodePointerWheel(100_000))].slice(3)).toEqual([
                0xff, 0x7f,
              ]);
            });
          });
          EOF

          cat > apps/windows-agent/src/pointer_wire.h <<'EOF'
          #pragma once

          #include <cstddef>
          #include <span>
          #include <string>

          namespace desklink {

          enum class PointerWireKind {
            Move,
            Wheel,
          };

          struct PointerWireEvent {
            PointerWireKind kind{PointerWireKind::Move};
            double x{0.0};
            double y{0.0};
            int wheel_delta{0};
          };

          bool ParsePointerWire(
              std::span<const std::byte> payload,
              PointerWireEvent* event);

          // Temporary compatibility path for Web controllers that still send the
          // old JSON pointer messages. This parser intentionally accepts only move
          // and wheel events so the unreliable pointer channel cannot invoke
          // privileged/reliable control operations.
          bool ParseLegacyPointerJson(
              const std::string& text,
              PointerWireEvent* event);

          }  // namespace desklink
          EOF

          cat > apps/windows-agent/src/pointer_wire.cpp <<'EOF'
          #include "pointer_wire.h"

          #include <algorithm>
          #include <cstdint>

          #include <nlohmann/json.hpp>

          namespace desklink {
          namespace {

          constexpr uint8_t kMagic = 0xd1;
          constexpr uint8_t kVersion = 1;
          constexpr uint8_t kMove = 1;
          constexpr uint8_t kWheel = 2;
          constexpr size_t kMoveSize = 7;
          constexpr size_t kWheelSize = 5;
          constexpr size_t kMaxLegacyPointerJsonBytes = 256;

          uint8_t Byte(std::byte value) {
            return std::to_integer<uint8_t>(value);
          }

          uint16_t ReadU16Le(std::span<const std::byte> payload, size_t offset) {
            return static_cast<uint16_t>(Byte(payload[offset])) |
                   static_cast<uint16_t>(static_cast<uint16_t>(Byte(payload[offset + 1])) << 8);
          }

          }  // namespace

          bool ParsePointerWire(
              std::span<const std::byte> payload,
              PointerWireEvent* event) {
            if (!event || payload.size() < 3 ||
                Byte(payload[0]) != kMagic || Byte(payload[1]) != kVersion) {
              return false;
            }

            const uint8_t opcode = Byte(payload[2]);
            if (opcode == kMove) {
              if (payload.size() != kMoveSize) return false;
              const uint16_t raw_x = ReadU16Le(payload, 3);
              const uint16_t raw_y = ReadU16Le(payload, 5);
              event->kind = PointerWireKind::Move;
              event->x = static_cast<double>(raw_x) / 65535.0;
              event->y = static_cast<double>(raw_y) / 65535.0;
              event->wheel_delta = 0;
              return true;
            }

            if (opcode == kWheel) {
              if (payload.size() != kWheelSize) return false;
              const uint16_t raw = ReadU16Le(payload, 3);
              const int delta = (raw & 0x8000u) != 0
                  ? static_cast<int>(raw) - 0x10000
                  : static_cast<int>(raw);
              event->kind = PointerWireKind::Wheel;
              event->x = 0.0;
              event->y = 0.0;
              event->wheel_delta = delta;
              return true;
            }

            return false;
          }

          bool ParseLegacyPointerJson(
              const std::string& text,
              PointerWireEvent* event) {
            if (!event || text.empty() || text.size() > kMaxLegacyPointerJsonBytes) return false;

            const nlohmann::json parsed = nlohmann::json::parse(text, nullptr, false);
            if (parsed.is_discarded() || !parsed.is_object()) return false;

            const auto type_it = parsed.find("t");
            if (type_it == parsed.end() || !type_it->is_string()) return false;
            const std::string type = type_it->get<std::string>();

            if (type == "pointer") {
              const auto kind_it = parsed.find("kind");
              const auto x_it = parsed.find("x");
              const auto y_it = parsed.find("y");
              if (kind_it == parsed.end() || !kind_it->is_string() ||
                  kind_it->get<std::string>() != "move" ||
                  x_it == parsed.end() || !x_it->is_number() ||
                  y_it == parsed.end() || !y_it->is_number()) {
                return false;
              }

              event->kind = PointerWireKind::Move;
              event->x = std::clamp(x_it->get<double>(), 0.0, 1.0);
              event->y = std::clamp(y_it->get<double>(), 0.0, 1.0);
              event->wheel_delta = 0;
              return true;
            }

            if (type == "wheel") {
              const auto delta_it = parsed.find("delta");
              if (delta_it == parsed.end() || !delta_it->is_number_integer()) return false;
              const int64_t delta = delta_it->get<int64_t>();
              event->kind = PointerWireKind::Wheel;
              event->x = 0.0;
              event->y = 0.0;
              event->wheel_delta = static_cast<int>(std::clamp<int64_t>(delta, -32768, 32767));
              return true;
            }

            return false;
          }

          }  // namespace desklink
          EOF

          cat > apps/windows-agent/src/pointer_wire_smoke.cpp <<'EOF'
          #include "pointer_wire.h"

          #include <cmath>
          #include <cstddef>
          #include <iostream>
          #include <vector>

          namespace {

          std::vector<std::byte> Bytes(std::initializer_list<unsigned int> values) {
            std::vector<std::byte> result;
            result.reserve(values.size());
            for (unsigned int value : values) {
              result.push_back(static_cast<std::byte>(value & 0xffu));
            }
            return result;
          }

          bool Near(double left, double right) {
            return std::abs(left - right) < 0.00002;
          }

          }  // namespace

          int main() {
            desklink::PointerWireEvent event;

            const auto move = Bytes({0xd1, 1, 1, 0x00, 0x80, 0xff, 0xff});
            if (!desklink::ParsePointerWire(move, &event) ||
                event.kind != desklink::PointerWireKind::Move ||
                !Near(event.x, 32768.0 / 65535.0) || !Near(event.y, 1.0)) {
              std::cerr << "Binary pointer move vector failed.\n";
              return 1;
            }

            const auto wheel = Bytes({0xd1, 1, 2, 0xa8, 0xfd});
            if (!desklink::ParsePointerWire(wheel, &event) ||
                event.kind != desklink::PointerWireKind::Wheel ||
                event.wheel_delta != -600) {
              std::cerr << "Binary pointer wheel vector failed.\n";
              return 1;
            }

            for (const auto& invalid : {
                     Bytes({0xd0, 1, 1, 0, 0, 0, 0}),
                     Bytes({0xd1, 2, 1, 0, 0, 0, 0}),
                     Bytes({0xd1, 1, 9, 0, 0}),
                     Bytes({0xd1, 1, 1, 0, 0}),
                 }) {
              if (desklink::ParsePointerWire(invalid, &event)) {
                std::cerr << "Invalid binary pointer payload was accepted.\n";
                return 1;
              }
            }

            if (!desklink::ParseLegacyPointerJson(
                    R"({"t":"pointer","kind":"move","x":0.25,"y":0.75})",
                    &event) ||
                event.kind != desklink::PointerWireKind::Move ||
                !Near(event.x, 0.25) || !Near(event.y, 0.75)) {
              std::cerr << "Legacy pointer move compatibility failed.\n";
              return 1;
            }

            if (!desklink::ParseLegacyPointerJson(R"({"t":"wheel","delta":120})", &event) ||
                event.kind != desklink::PointerWireKind::Wheel || event.wheel_delta != 120) {
              std::cerr << "Legacy wheel compatibility failed.\n";
              return 1;
            }

            if (desklink::ParseLegacyPointerJson(
                    R"({"t":"pointer","kind":"down","x":0.5,"y":0.5,"button":0})",
                    &event) ||
                desklink::ParseLegacyPointerJson(
                    R"({"t":"system-operation","operation":"secure-attention-sequence"})",
                    &event)) {
              std::cerr << "Unreliable pointer channel accepted a reliable/privileged operation.\n";
              return 1;
            }

            std::cout << "DeskLink binary pointer wire smoke passed.\n";
            return 0;
          }
          EOF

          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/web/src/main.tsx',
              'import { isActiveSessionResource } from "./session_resource_scope";\n',
              'import { isActiveSessionResource } from "./session_resource_scope";\nimport { encodePointerMove, encodePointerWheel } from "./pointer_wire";\n',
          )
          replace_once(
              'apps/web/src/main.tsx',
              '  const sendPointerFast = (payload: object) => {\n    const channel = pointerRef.current;\n    if (channel?.readyState === "open") channel.send(JSON.stringify(payload));\n  };',
              '  const sendPointerFast = (payload: ArrayBuffer) => {\n    const channel = pointerRef.current;\n    if (channel?.readyState === "open") channel.send(payload);\n  };',
          )
          replace_once(
              'apps/web/src/main.tsx',
              '      if (latest) sendPointerFast(latest);',
              '      if (latest) sendPointerFast(encodePointerMove(latest.x, latest.y));',
          )
          replace_once(
              'apps/web/src/main.tsx',
              '            sendPointerFast({ t: "wheel", delta: (e.deltaY < 0 ? 120 : -120) * magnitude });',
              '            sendPointerFast(encodePointerWheel((e.deltaY < 0 ? 120 : -120) * magnitude));',
          )

          replace_once(
              'apps/windows-agent/src/webrtc_session.cpp',
              '#include "file_transfer_receiver.h"\n',
              '#include "file_transfer_receiver.h"\n#include "pointer_wire.h"\n',
          )
          old_handler = '''  channel->onMessage([this](rtc::message_variant data) {
    if (const auto* text = std::get_if<std::string>(&data)) {
      HandleControl(*text);
    }
  });'''
          new_handler = '''  channel->onMessage([this, label](rtc::message_variant data) {
    if (label == "pointer") {
      PointerWireEvent event;
      bool parsed = false;
      if (const auto* binary = std::get_if<rtc::binary>(&data)) {
        parsed = ParsePointerWire(
            std::span<const std::byte>(binary->data(), binary->size()),
            &event);
      } else if (const auto* text = std::get_if<std::string>(&data)) {
        parsed = ParseLegacyPointerJson(*text, &event);
      }
      if (!parsed) return;

      if (event.kind == PointerWireKind::Move) {
        input_.PointerMove(event.x, event.y);
      } else if (event.kind == PointerWireKind::Wheel) {
        input_.PointerWheel(event.wheel_delta);
      }
      return;
    }

    if (const auto* text = std::get_if<std::string>(&data)) {
      HandleControl(*text);
    }
  });'''
          replace_once('apps/windows-agent/src/webrtc_session.cpp', old_handler, new_handler)

          replace_once(
              'apps/windows-agent/CMakeLists.txt',
              '  src/input_injector.cpp\n  src/input_injector.h\n  src/performance_tuning.cpp\n',
              '  src/input_injector.cpp\n  src/input_injector.h\n  src/pointer_wire.cpp\n  src/pointer_wire.h\n  src/performance_tuning.cpp\n',
          )
          append_anchor = '''add_executable(desklink-video-policy-smoke
  src/video_policy_smoke.cpp
  src/video_policy.cpp
  src/video_policy.h
)
target_compile_definitions(desklink-video-policy-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
target_compile_options(desklink-video-policy-smoke PRIVATE /W4 /permissive-)
'''
          append_value = append_anchor + '''
add_executable(desklink-pointer-wire-smoke
  src/pointer_wire_smoke.cpp
  src/pointer_wire.cpp
  src/pointer_wire.h
)
target_compile_definitions(desklink-pointer-wire-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
target_compile_options(desklink-pointer-wire-smoke PRIVATE /W4 /permissive-)
target_link_libraries(desklink-pointer-wire-smoke PRIVATE nlohmann_json::nlohmann_json)
'''
          replace_once('apps/windows-agent/CMakeLists.txt', append_anchor, append_value)
          PY

          git diff --check

      - name: Validate Web pointer wire path
        shell: bash
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Configure Windows host
        shell: bash
        run: cmake -S apps/windows-agent -B build/pointer-wire -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows agent and pointer smoke
        shell: bash
        run: cmake --build build/pointer-wire --config Release --target desklink-agent desklink-pointer-wire-smoke --parallel

      - name: Run pointer wire smoke
        shell: bash
        run: ./build/pointer-wire/Release/desklink-pointer-wire-smoke.exe

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/main.tsx \
            apps/web/src/pointer_wire.ts \
            apps/web/src/pointer_wire.test.ts \
            apps/windows-agent/CMakeLists.txt \
            apps/windows-agent/src/webrtc_session.cpp \
            apps/windows-agent/src/pointer_wire.h \
            apps/windows-agent/src/pointer_wire.cpp \
            apps/windows-agent/src/pointer_wire_smoke.cpp
          git diff --cached --check
          git commit -m "perf(input): add compact binary pointer fast path"
          git push origin HEAD:main
