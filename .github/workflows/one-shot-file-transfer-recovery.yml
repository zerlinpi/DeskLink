name: One-shot file transfer recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-file-transfer-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Patch file transfer channel replacement recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/file_transfer.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'type ControlChannelDetail = {\n'
          import_block = '''import {
            pauseDownloadForChannelReplacement,
            pauseUploadForChannelReplacement,
          } from "./file_transfer_recovery";

          '''
          import_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in import_block.splitlines()) + '\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')
          if 'from "./file_transfer_recovery"' not in text:
              text = text.replace(import_anchor, import_block + import_anchor, 1)

          old = '''function attachTransferChannel(channel: RTCDataChannel) {
            if (transferChannel && transferChannel !== channel && transferChannel.readyState !== "closed") {
              try { transferChannel.close(); } catch { /* ignored */ }
            }
            transferChannel = channel;
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''function pauseTransfersForChannelReplacement() {
            const uploadPaused = pauseUploadForChannelReplacement(activeJob);
            const downloadPaused = pauseDownloadForChannelReplacement(activeDownload);
            if (!uploadPaused && !downloadPaused) return;

            setStatus("文件通道正在恢复，将从已确认位置自动续传");
            renderJobs();
            renderDownload();
          }

          function attachTransferChannel(channel: RTCDataChannel) {
            if (transferChannel && transferChannel !== channel) {
              pauseTransfersForChannelReplacement();
              if (transferChannel.readyState !== "closed") {
                try { transferChannel.close(); } catch { /* ignored */ }
              }
            }
            transferChannel = channel;
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit(f'attachTransferChannel anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Commit recovery fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/file_transfer.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): resume file transfers after channel replacement"
          git push origin HEAD:main
