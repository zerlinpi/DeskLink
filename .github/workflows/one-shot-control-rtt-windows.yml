name: One-shot Windows control RTT acknowledgement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-rtt-windows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('VERSION', 'apps/windows-agent/CMakeLists.txt', 'packages/protocol/**') }}

      - name: Add bounded control RTT echo
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('apps/windows-agent/src/webrtc_session.cpp'); t=p.read_text(encoding='utf-8'); old='  if (type == \"release-all\") {\n    input_.ReleaseAll();\n    return;\n  }\n\n  if (type == \"system-operation\") {\n'; new='  if (type == \"release-all\") {\n    input_.ReleaseAll();\n    return;\n  }\n\n  if (type == \"control-rtt-probe\") {\n    const std::string request_id = event.value(\"requestId\", \"\");\n    if (!ValidRequestId(request_id)) return;\n    SendControlMessage(json{\n        {\"t\", \"control-rtt-ack\"},\n        {\"requestId\", request_id},\n    }.dump());\n    return;\n  }\n\n  if (type == \"system-operation\") {\n'; c=t.count(old); assert c == 1, f'control RTT insertion anchor count={c}'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
          git diff --check

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE
      - name: Build Windows agent
        run: cmake --build build/windows-agent --config Release --target desklink-agent --parallel

      - name: Commit Windows acknowledgement
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/webrtc_session.cpp
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat(windows): echo control channel RTT probes"
          git push origin HEAD:main
