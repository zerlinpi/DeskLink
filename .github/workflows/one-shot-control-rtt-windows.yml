name: One-shot Windows control RTT acknowledgement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-rtt-windows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('VERSION', 'apps/windows-agent/CMakeLists.txt', 'packages/protocol/**') }}

      - name: Add bounded control RTT echo
        shell: pwsh
        run: |
          $env:OLD_BLOCK_B64 = 'ICBpZiAodHlwZSA9PSAicmVsZWFzZS1hbGwiKSB7CiAgICBpbnB1dF8uUmVsZWFzZUFsbCgpOwogICAgcmV0dXJuOwogIH0KCiAgaWYgKHR5cGUgPT0gInN5c3RlbS1vcGVyYXRpb24iKSB7Cg=='
          $env:NEW_BLOCK_B64 = ''
          python -c "import base64, os; from pathlib import Path; p=Path('apps/windows-agent/src/webrtc_session.cpp'); t=p.read_text(encoding='utf-8'); old=base64.b64decode(os.environ['OLD_BLOCK_B64']).decode(); new=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode(); c=t.count(old); assert c == 1, f'control RTT insertion anchor count={c}'; p.write_text(t.replace(old,new,1), encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw "control RTT source patch failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "patched source failed git diff --check" }
          if (git diff --quiet -- apps/windows-agent/src/webrtc_session.cpp) { throw "control RTT source patch produced no change" }
          Select-String -Path apps/windows-agent/src/webrtc_session.cpp -Pattern 'control-rtt-ack' -SimpleMatch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "control RTT acknowledgement was not present after patch" }

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE
      - name: Build Windows agent
        run: cmake --build build/windows-agent --config Release --target desklink-agent --parallel

      - name: Commit Windows acknowledgement
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/webrtc_session.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged control RTT patch failed git diff --check" }
          if (git diff --cached --quiet) { throw "validated control RTT patch was not staged" }
          git commit -m "feat(windows): echo control channel RTT probes"
          if ($LASTEXITCODE -ne 0) { throw "control RTT commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "control RTT push failed" }
