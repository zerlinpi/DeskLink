name: One-shot remote negotiation race hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remote-negotiation-race.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Guard late WebRTC negotiation completions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          scope_path = Path('apps/web/src/session_resource_scope.ts')
          scope = scope_path.read_text(encoding='utf-8')
          helper = '''\nexport function isActiveAsyncSessionResource<T>(\n  current: T | null,\n  source: T,\n  manualDisconnect: boolean,\n  callbackScopeCurrent: boolean,\n): boolean {\n  return callbackScopeCurrent &&\n    isActiveSessionResource(current, source, manualDisconnect);\n}\n'''
          if 'isActiveAsyncSessionResource' not in scope:
              scope_path.write_text(scope.rstrip() + '\n' + helper, encoding='utf-8')

          test_path = Path('apps/web/src/session_resource_scope.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_import = 'import { isActiveSessionResource } from "./session_resource_scope";'
          new_import = '''import {\n  isActiveAsyncSessionResource,\n  isActiveSessionResource,\n} from "./session_resource_scope";'''
          if old_import in test:
              test = test.replace(old_import, new_import, 1)
          elif 'isActiveAsyncSessionResource' not in test:
              raise SystemExit('session resource scope test import anchor missing')

          if 'describe("isActiveAsyncSessionResource"' not in test:
              test += '''\n\ndescribe("isActiveAsyncSessionResource", () => {\n  it("commits an async completion only while callback and resource scopes are current", () => {\n    const resource = {};\n    expect(isActiveAsyncSessionResource(resource, resource, false, true)).toBe(true);\n  });\n\n  it("rejects a late completion after socket/session scope changed", () => {\n    const resource = {};\n    expect(isActiveAsyncSessionResource(resource, resource, false, false)).toBe(false);\n  });\n\n  it("rejects a late completion from a replaced peer", () => {\n    expect(isActiveAsyncSessionResource({}, {}, false, true)).toBe(false);\n  });\n\n  it("rejects a late completion during manual disconnect", () => {\n    const resource = {};\n    expect(isActiveAsyncSessionResource(resource, resource, true, true)).toBe(false);\n  });\n});\n'''
          test_path.write_text(test, encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')

          old_import = 'import { isActiveSessionResource } from "./session_resource_scope";'
          new_import = '''import {\n  isActiveAsyncSessionResource,\n  isActiveSessionResource,\n} from "./session_resource_scope";'''
          if old_import in main:
              main = main.replace(old_import, new_import, 1)
          elif 'isActiveAsyncSessionResource' not in main:
              raise SystemExit('main session resource scope import anchor missing')

          anchor = '''    const pc = pcRef.current;\n    if (!pc) return;\n\n    if (msg.type === "answer" && msg.payload) {'''
          replacement = '''    const pc = pcRef.current;\n    if (!pc) return;\n    const negotiationScopeCurrent = () => isActiveAsyncSessionResource(\n      pcRef.current,\n      pc,\n      manualDisconnectRef.current,\n      callbackScopeCurrent(),\n    );\n\n    if (msg.type === "answer" && msg.payload) {'''
          if anchor in main:
              main = main.replace(anchor, replacement, 1)
          elif 'const negotiationScopeCurrent = () => isActiveAsyncSessionResource(' not in main:
              raise SystemExit('remote negotiation scope insertion anchor missing')

          old_answer = '''    if (msg.type === "answer" && msg.payload) {\n      try {\n        await pc.setRemoteDescription(msg.payload as RTCSessionDescriptionInit);\n        negotiationPendingRef.current = false;\n        iceRestartInFlightRef.current = false;\n        clearIceRestartWatchdog();\n\n        const pending = pendingRemoteIceRef.current;\n        pendingRemoteIceRef.current = [];\n        for (const candidate of pending) {\n          try {\n            await pc.addIceCandidate(candidate);\n          } catch (error) {\n            console.debug("DeskLink queued remote ICE rejected", error);\n          }\n        }\n      } catch (error) {\n        console.debug("DeskLink remote answer rejected", error);\n        negotiationPendingRef.current = false;\n        iceRestartInFlightRef.current = false;\n        scheduleIceRestart(pc, false);\n      }\n    } else if (msg.type === "ice" && msg.payload) {\n      const candidate = msg.payload as RTCIceCandidateInit;\n      if (pc.remoteDescription && !negotiationPendingRef.current) {\n        try {\n          await pc.addIceCandidate(candidate);\n        } catch (error) {\n          console.debug("DeskLink remote ICE rejected", error);\n        }\n      } else {\n        pendingRemoteIceRef.current.push(candidate);\n      }\n    }'''
          new_answer = '''    if (msg.type === "answer" && msg.payload) {\n      try {\n        await pc.setRemoteDescription(msg.payload as RTCSessionDescriptionInit);\n        if (!negotiationScopeCurrent()) return;\n        negotiationPendingRef.current = false;\n        iceRestartInFlightRef.current = false;\n        clearIceRestartWatchdog();\n\n        const pending = pendingRemoteIceRef.current;\n        pendingRemoteIceRef.current = [];\n        for (const candidate of pending) {\n          try {\n            await pc.addIceCandidate(candidate);\n            if (!negotiationScopeCurrent()) return;\n          } catch (error) {\n            if (!negotiationScopeCurrent()) return;\n            console.debug("DeskLink queued remote ICE rejected", error);\n          }\n        }\n      } catch (error) {\n        if (!negotiationScopeCurrent()) return;\n        console.debug("DeskLink remote answer rejected", error);\n        negotiationPendingRef.current = false;\n        iceRestartInFlightRef.current = false;\n        scheduleIceRestart(pc, false);\n      }\n    } else if (msg.type === "ice" && msg.payload) {\n      const candidate = msg.payload as RTCIceCandidateInit;\n      if (pc.remoteDescription && !negotiationPendingRef.current) {\n        try {\n          await pc.addIceCandidate(candidate);\n          if (!negotiationScopeCurrent()) return;\n        } catch (error) {\n          if (!negotiationScopeCurrent()) return;\n          console.debug("DeskLink remote ICE rejected", error);\n        }\n      } else if (negotiationScopeCurrent()) {\n        pendingRemoteIceRef.current.push(candidate);\n      }\n    }'''
          if old_answer in main:
              main = main.replace(old_answer, new_answer, 1)
          elif new_answer not in main:
              raise SystemExit('remote answer/ICE block anchor missing')

          main_path.write_text(main, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Run Web tests
        working-directory: apps/web
        run: npm test

      - name: Build production Web bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit hardened negotiation scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/session_resource_scope.ts apps/web/src/session_resource_scope.test.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): ignore late remote negotiation completions"
          git push origin HEAD:main
