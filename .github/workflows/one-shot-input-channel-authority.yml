name: One-shot Windows input channel authority integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-input-channel-authority.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate input channel authority
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          cmake_path = Path('apps/windows-agent/CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          cmake = replace_once(
              cmake,
              '  src/input_injector.cpp\n  src/input_injector.h\n',
              '  src/input_channel_authority.h\n  src/input_injector.cpp\n  src/input_injector.h\n',
              'agent authority header',
          )
          cmake = replace_once(
              cmake,
              'add_executable(desklink-pointer-wire-smoke\n  src/pointer_wire_smoke.cpp\n  src/pointer_wire.cpp\n  src/pointer_wire.h\n)\ntarget_compile_definitions(desklink-pointer-wire-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)\ntarget_compile_options(desklink-pointer-wire-smoke PRIVATE /W4 /permissive-)\ntarget_link_libraries(desklink-pointer-wire-smoke PRIVATE nlohmann_json::nlohmann_json)\n\n',
              'add_executable(desklink-pointer-wire-smoke\n  src/pointer_wire_smoke.cpp\n  src/pointer_wire.cpp\n  src/pointer_wire.h\n)\ntarget_compile_definitions(desklink-pointer-wire-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)\ntarget_compile_options(desklink-pointer-wire-smoke PRIVATE /W4 /permissive-)\ntarget_link_libraries(desklink-pointer-wire-smoke PRIVATE nlohmann_json::nlohmann_json)\n\nadd_executable(desklink-input-channel-authority-smoke\n  src/input_channel_authority_smoke.cpp\n  src/input_channel_authority.h\n)\ntarget_compile_definitions(desklink-input-channel-authority-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)\ntarget_compile_options(desklink-input-channel-authority-smoke PRIVATE /W4 /permissive-)\n\n',
              'authority smoke target',
          )
          cmake_path.write_text(cmake, encoding='utf-8')

          cpp_path = Path('apps/windows-agent/src/webrtc_session.cpp')
          cpp = cpp_path.read_text(encoding='utf-8')

          # Session shutdown: all outstanding DataChannel callbacks lose authority
          # before the peer is closed. ReleaseAll() already runs before this block.
          stop_anchor = '''    control_.reset();
    file_transfer_receiver_.reset();
    video_track_.reset();
'''
          stop_replacement = '''    control_.reset();
    input_channel_authority_.InvalidateAll();
    file_transfer_receiver_.reset();
    video_track_.reset();
'''
          # The same three-line resource reset appears in Stop and device-revoked.
          if cpp.count(stop_anchor) != 2:
              raise SystemExit(f'session reset anchor count={cpp.count(stop_anchor)}')
          cpp = cpp.replace(stop_anchor, stop_replacement, 2)

          cpp = replace_once(
              cpp,
              '''    peer_ = peer;
    control_.reset();
    file_transfer_receiver_.reset();
''',
              '''    peer_ = peer;
    control_.reset();
    input_channel_authority_.InvalidateAll();
    file_transfer_receiver_.reset();
''',
              'peer replacement authority invalidation',
          )

          start = cpp.index('void WebRtcSession::AttachControlChannel(')
          end = cpp.index('\nvoid WebRtcSession::HandleControl(', start)
          replacement = r'''void WebRtcSession::AttachControlChannel(const std::shared_ptr<rtc::DataChannel>& channel) {
  if (!channel) return;

  const std::string label = channel->label();
  InputChannelKind kind;
  if (label == "control") {
    kind = InputChannelKind::Control;
  } else if (label == "pointer") {
    kind = InputChannelKind::Pointer;
  } else {
    return;
  }

  InputChannelGeneration generation = 0;
  {
    std::scoped_lock lock(mutex_);
    generation = input_channel_authority_.Activate(kind);
    if (kind == InputChannelKind::Control) control_ = channel;
  }

  const std::weak_ptr<rtc::DataChannel> weak_channel = channel;
  channel->onOpen([this, label, kind, generation, weak_channel]() {
    auto opened = weak_channel.lock();
    if (!opened) return;
    {
      std::scoped_lock lock(mutex_);
      if (!input_channel_authority_.IsCurrent(kind, generation)) return;
      if (kind == InputChannelKind::Control && control_ != opened) return;
    }

    std::cout << label << " DataChannel open\n";
    if (kind == InputChannelKind::Control && config_.on_monitor_state_requested) {
      config_.on_monitor_state_requested();
    }
  });

  channel->onClosed([this, label, kind, generation, weak_channel]() {
    auto closed = weak_channel.lock();
    bool was_current = false;
    {
      std::scoped_lock lock(mutex_);
      was_current = input_channel_authority_.RevokeIfCurrent(kind, generation);
      if (!was_current) return;
      if (kind == InputChannelKind::Control && (!closed || control_ == closed)) {
        control_.reset();
      }
    }

    // Only the currently authoritative input channel is an authority-loss
    // boundary. A predecessor that closes after its replacement is active must
    // not release keys/buttons belonging to the replacement.
    input_.ReleaseAll();
    std::cout << label << " DataChannel closed\n";
  });

  channel->onMessage([this, label, kind, generation, weak_channel](rtc::message_variant data) {
    auto source = weak_channel.lock();
    if (!source) return;
    {
      std::scoped_lock lock(mutex_);
      if (!input_channel_authority_.IsCurrent(kind, generation)) return;
      if (kind == InputChannelKind::Control && control_ != source) return;
    }

    if (kind == InputChannelKind::Pointer) {
      PointerWireEvent event;
      bool parsed = false;
      if (const auto* binary = std::get_if<rtc::binary>(&data)) {
        parsed = ParsePointerWire(
            std::span<const std::byte>(binary->data(), binary->size()),
            &event);
      } else if (const auto* text = std::get_if<std::string>(&data)) {
        parsed = ParseLegacyPointerJson(*text, &event);
      }
      if (!parsed) return;

      // Parsing can be non-trivial. Recheck authority immediately before input
      // injection so a concurrent replacement cannot leave a stale pointer
      // callback with a long-lived permission decision.
      {
        std::scoped_lock lock(mutex_);
        if (!input_channel_authority_.IsCurrent(kind, generation)) return;
      }
      if (event.kind == PointerWireKind::Move) {
        input_.PointerMove(event.x, event.y);
      } else if (event.kind == PointerWireKind::Wheel) {
        input_.PointerWheel(event.wheel_delta);
      }
      return;
    }

    if (const auto* text = std::get_if<std::string>(&data)) {
      {
        std::scoped_lock lock(mutex_);
        if (!input_channel_authority_.IsCurrent(kind, generation) || control_ != source) return;
      }
      HandleControl(*text);
    }
  });
}
'''
          cpp = cpp[:start] + replacement + cpp[end:]
          cpp_path.write_text(cpp, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "authority integration patch failed" }
          git diff --check

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host and authority smoke
        run: cmake --build build/windows-agent --config Release --parallel --target desklink-agent desklink-input-channel-authority-smoke

      - name: Run input channel authority smoke
        shell: pwsh
        run: |
          & "build/windows-agent/Release/desklink-input-channel-authority-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "input channel authority smoke failed" }

      - name: Commit native integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/CMakeLists.txt apps/windows-agent/src/webrtc_session.cpp
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(windows): ignore stale input DataChannel callbacks"
            git push origin HEAD:main
          }
