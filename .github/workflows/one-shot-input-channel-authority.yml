name: One-shot Windows input channel authority integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-input-channel-authority.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate input channel authority
        run: python tools/ci/integrate-input-channel-authority.py

      - name: Validate source diff
        shell: pwsh
        run: git diff --check

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host and authority smoke
        run: cmake --build build/windows-agent --config Release --parallel --target desklink-agent desklink-input-channel-authority-smoke

      - name: Run input channel authority smoke
        shell: pwsh
        run: |
          & "build/windows-agent/Release/desklink-input-channel-authority-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "input channel authority smoke failed" }

      - name: Commit native integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item "tools/ci/integrate-input-channel-authority.py"
          git add apps/windows-agent/CMakeLists.txt apps/windows-agent/src/webrtc_session.cpp tools/ci/integrate-input-channel-authority.py
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix(windows): ignore stale input DataChannel callbacks"
            git push origin HEAD:main
          }
