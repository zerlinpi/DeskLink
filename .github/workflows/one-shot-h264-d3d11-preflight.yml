name: One-shot H264 encoder D3D11 preflight integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-h264-d3d11-preflight.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply H264 encoder D3D11 preflight
        run: |
          python tools/ci/integrate-h264-d3d11-preflight.py
          git diff --check

      - name: Validate preflight source invariants
        shell: bash
        run: |
          set -euo pipefail
          source_file="apps/windows-agent/src/h264_encoder.cpp"
          grep -q 'MF_TRANSFORM_ASYNC_UNLOCK' "$source_file"
          grep -q 'MF_SA_D3D11_AWARE' "$source_file"
          grep -q 'candidate preflight failed' "$source_file"
          grep -q 'skipping zero-copy path' "$source_file"
          grep -q 'device_manager_.Get()' "$source_file"
          count="$(grep -c 'MFT_MESSAGE_SET_D3D_MANAGER' "$source_file")"
          test "$count" -eq 1 || {
            echo "D3D manager setup must live only in candidate preflight; count=$count" >&2
            exit 1
          }

      - name: Ensure main has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          test "$remote" = "$GITHUB_SHA" || {
            echo "main advanced while integration was running; refusing stale write" >&2
            exit 1
          }

      - name: Commit D3D11-aware candidate preflight
        shell: bash
        run: |
          set -euo pipefail
          rm tools/ci/integrate-h264-d3d11-preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/h264_encoder.cpp tools/ci/integrate-h264-d3d11-preflight.py
          git diff --cached --check
          git commit -m "fix(windows): preflight H264 encoder D3D11 compatibility"
          git push origin HEAD:main
