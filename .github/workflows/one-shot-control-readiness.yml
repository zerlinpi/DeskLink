name: One-shot control readiness hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-control-readiness.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require open control channel before ready status
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/main.tsx")
          text = path.read_text(encoding="utf-8")
          old = '      if (state === "connected") {\n        clearIceRestartTimer();\n        clearIceRestartWatchdog();\n        iceRestartInFlightRef.current = false;\n        setStatus(wsRef.current?.readyState === WebSocket.OPEN\n          ? "control ready"\n          : "control ready · signaling reconnecting");\n        if (controlRef.current?.readyState === "open") startTelemetry(pc);\n        if (controlRef.current?.readyState === "closed") {\n          scheduleDataChannelRecovery(pc, "control", controlRef.current);\n        }\n        if (pointerRef.current?.readyState === "closed") {\n          scheduleDataChannelRecovery(pc, "pointer", pointerRef.current);\n        }\n'
          new = '      if (state === "connected") {\n        clearIceRestartTimer();\n        clearIceRestartWatchdog();\n        iceRestartInFlightRef.current = false;\n        const controlState = controlRef.current?.readyState;\n        if (controlState === "open") {\n          setStatus(wsRef.current?.readyState === WebSocket.OPEN\n            ? "control ready"\n            : "control ready · signaling reconnecting");\n          startTelemetry(pc);\n        } else if (controlState === "closed") {\n          setStatus("recovering control channel");\n          scheduleDataChannelRecovery(pc, "control", controlRef.current);\n        } else {\n          setStatus("establishing control channel");\n        }\n        if (pointerRef.current?.readyState === "closed") {\n          scheduleDataChannelRecovery(pc, "pointer", pointerRef.current);\n        }\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one connected readiness block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          ui_path = Path("apps/web/src/home_ui.ts")
          ui = ui_path.read_text(encoding="utf-8")
          old_ui = '  if (normalized.includes("recovering control channel")) return "控制通道恢复中";\n'
          new_ui = '  if (normalized.includes("establishing control channel")) return "正在建立控制通道";\n  if (normalized.includes("recovering control channel")) return "控制通道恢复中";\n'
          if ui.count(old_ui) != 1:
              raise SystemExit(f"expected one control recovery UI anchor, got {ui.count(old_ui)}")
          ui_path.write_text(ui.replace(old_ui, new_ui, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Production build
        working-directory: apps/web
        run: npm run build
      - name: Commit readiness hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/home_ui.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No readiness changes to commit"
            exit 0
          fi
          git commit -m "fix(web): report ready only after control channel opens"
          git push origin HEAD:main
