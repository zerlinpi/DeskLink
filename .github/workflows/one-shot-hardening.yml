name: One-shot dependency and capability hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply hardening changes
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          package_path = Path('apps/web/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['devDependencies']['vite'] = '7.3.5'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def replace_regex(path, pattern, replacement, label):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement, got {count}')
              file_path.write_text(updated, encoding='utf-8')

          replace_regex(
              'apps/windows-agent/src/main.cpp',
              r'  auto send_monitor_state = \[&\]\(\) \{\n    desklink::ServiceSecureAttentionStatus sas_status;.*?\n    nlohmann::json monitors',
              '  auto send_monitor_state = [&]() {\n    nlohmann::json monitors',
              'main.cpp legacy host-capabilities block',
          )
          replace_regex(
              'apps/windows-agent/src/webrtc_session.h',
              r'  // Transitional overload:.*?\n  // Encoded access units',
              '  // Encoded access units',
              'WebRtcSession transitional overload',
          )
          replace_regex(
              'apps/windows-agent/src/host_capabilities.h',
              r'// Transitional guard for the old main\.cpp monitor-state block\..*?bool IsLegacyHostCapabilitiesV1Message\(const std::string& text\);\n\n',
              '',
              'legacy capability guard declaration',
          )
          replace_regex(
              'apps/windows-agent/src/host_capabilities.cpp',
              r'\nbool IsLegacyHostCapabilitiesV1Message\(const std::string& text\) \{.*?\n\}\n\n(?=}  // namespace desklink)',
              '\n',
              'legacy capability guard implementation',
          )

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = [
              ('cd apps/web\nnpm install\nnpm run dev', 'cd apps/web\nnpm ci\nnpm run dev'),
              ('生产环境建议：', '生产源码构建时的 fallback 示例（部署后优先使用运行时配置）：'),
              ('VITE_TURN_RUNTIME_REQUIRED=1\n```\n\n## Release 与下载', 'VITE_TURN_RUNTIME_REQUIRED=1\n```\n\n生产部署的 `dist` 支持 **build once, deploy anywhere**：无需重新执行 Vite 构建，直接修改与 `index.html` 同目录的 `desklink-config.js` 即可切换 Signal、Controller Session、STUN/TURN 等公开端点和运行时开关。该文件必须保持公开配置属性，禁止写入 Access Code、Device Credential、Controller secret、Signal token、TURN shared secret 或长期 TURN 用户名/密码。`VITE_*` 仅作为源码构建期 fallback。\n\n## Release 与下载'),
              ('正式版本通过 GitHub Releases 发布。每个版本通常包含：', '当前 `main` 使用带 `-dev` 后缀的开发版本号；只有与 `VERSION` 完全匹配的稳定 `vX.Y.Z` tag 才能发布稳定 Release 和稳定容器标签。\n\n正式版本通过 GitHub Releases 发布。每个版本通常包含：'),
              ('- `desklink-web-v<version>.tar.gz`：浏览器控制端发布包。', '- `desklink-web-v<version>-dist.tar.gz`：可直接部署的浏览器控制端静态产物。\n- `desklink-web-v<version>-source.tar.gz`：用于审计、开发或自定义构建的 Web 源码包。'),
          ]
          for old, new in replacements:
              if old not in readme:
                  raise SystemExit(f'README replacement anchor not found: {old[:80]!r}')
              readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Refresh npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit Web dependency tree
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Run Web tests
        working-directory: apps/web
        run: npm test

      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Verify legacy capability shim is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "secureAttentionAvailable" apps/windows-agent/src/main.cpp
          ! grep -n "IsLegacyHostCapabilitiesV1Message" \
            apps/windows-agent/src/host_capabilities.h \
            apps/windows-agent/src/host_capabilities.cpp \
            apps/windows-agent/src/webrtc_session.h
          git diff --check

      - name: Commit hardened dependency graph and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            apps/web/package.json \
            apps/web/package-lock.json \
            apps/windows-agent/src/main.cpp \
            apps/windows-agent/src/webrtc_session.h \
            apps/windows-agent/src/host_capabilities.h \
            apps/windows-agent/src/host_capabilities.cpp
          git diff --cached --quiet && {
            echo "No hardening changes to commit"
            exit 0
          }
          git commit -m "security(web): upgrade Vite and remove legacy capability shim"
          git push origin HEAD:main
