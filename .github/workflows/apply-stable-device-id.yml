name: Apply Stable Device Identity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stable-device-id.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire stable device identity into manager service and installer
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          setup = 'apps/windows-agent/src/setup_main.cpp'
          replace_exact(setup, '#include "protected_credential_store.h"', '#include "device_identity.h"\n#include "protected_credential_store.h"')
          p = Path(setup)
          text = p.read_text(encoding='utf-8')
          start = text.index('std::wstring DefaultDeviceId() {')
          end = text.index('\n}\n\nstd::wstring SignalHealthUrl', start) + 2
          new = '''std::wstring DefaultDeviceId() {
            std::wstring error;
            std::wstring id = desklink::StableDefaultDeviceId(&error);
            if (!id.empty()) return id;

            wchar_t name[MAX_COMPUTERNAME_LENGTH + 1]{};
            DWORD size = static_cast<DWORD>(std::size(name));
            if (GetComputerNameW(name, &size) && size > 0) {
              id = L"win-";
              id.append(name, size);
              for (wchar_t& ch : id) {
                if (!((ch >= L'a' && ch <= L'z') || (ch >= L'A' && ch <= L'Z') ||
                      (ch >= L'0' && ch <= L'9') || ch == L'-' || ch == L'_' || ch == L'.')) {
                  ch = L'-';
                }
              }
              return id;
            }
            return L"windows-host";
          }'''
          p.write_text(text[:start] + new + text[end:], encoding='utf-8', newline='\n')

          service = 'apps/windows-agent/src/service_main.cpp'
          replace_exact(service, '#include "active_session.h"\n#include "protected_credential_store.h"', '#include "active_session.h"\n#include "device_identity.h"\n#include "protected_credential_store.h"')
          replace_exact(
              service,
              '    if (command == L"--install") return InstallService();',
              '''    if (command == L"--print-default-device-id") {
                  std::wstring error;
                  const std::wstring id = desklink::StableDefaultDeviceId(&error);
                  if (id.empty()) {
                    std::wcerr << L"Unable to derive stable Device ID: " << error << L"\\n";
                    return 1;
                  }
                  std::wcout << id << L"\\n";
                  return 0;
                }
                if (command == L"--install") return InstallService();''',
          )
          replace_exact(
              service,
              '          << L"Usage: desklink-service.exe --install | --uninstall | --service | "\n             L"--store-device-credential | --clear-device-credential | "',
              '          << L"Usage: desklink-service.exe --print-default-device-id | --install | --uninstall | --service | "\n             L"--store-device-credential | --clear-device-credential | "',
          )

          installer = 'packaging/windows/install-service.ps1'
          replace_exact(installer, '  [Parameter(Mandatory = $true)][string]$DeviceId,', '  [string]$DeviceId = "",')
          replace_exact(
              installer,
              "if ($DeviceId -notmatch '^[A-Za-z0-9._-]{1,128}$') {\n  throw \"DeviceId may contain only letters, digits, '.', '_' and '-'.\"\n}\nif ($TurnPort -lt 1 -or $TurnPort -gt 65535)",
              "if (-not [string]::IsNullOrWhiteSpace($DeviceId) -and $DeviceId -notmatch '^[A-Za-z0-9._-]{1,128}$') {\n  throw \"DeviceId may contain only letters, digits, '.', '_' and '-'.\"\n}\nif ($TurnPort -lt 1 -or $TurnPort -gt 65535)",
          )
          replace_exact(
              installer,
              'if (-not (Test-Path $serviceSource)) { throw "desklink-service.exe was not found beside this installer script." }\n\n$existing = Get-Service',
              '''if (-not (Test-Path $serviceSource)) { throw "desklink-service.exe was not found beside this installer script." }

          if ([string]::IsNullOrWhiteSpace($DeviceId)) {
            $DeviceId = (& $serviceSource --print-default-device-id | Select-Object -Last 1).Trim()
            if ($LASTEXITCODE -ne 0 -or $DeviceId -notmatch '^[A-Za-z0-9._-]{1,128}$') {
              throw "Unable to derive a stable default DeskLink DeviceId. Specify -DeviceId explicitly."
            }
            Write-Host "Using stable DeskLink Device ID: $DeviceId"
          }

          $existing = Get-Service''',
          )

          cmake = 'apps/windows-agent/CMakeLists.txt'
          replace_exact(cmake, '  src/active_session.h\n  src/protected_credential_store.cpp', '  src/active_session.h\n  src/device_identity.cpp\n  src/device_identity.h\n  src/protected_credential_store.cpp')
          replace_exact(cmake, '    advapi32\n    crypt32\n    shell32', '    advapi32\n    bcrypt\n    crypt32\n    shell32', expected=1)
          replace_exact(cmake, 'add_executable(desklink-manager WIN32\n  src/setup_main.cpp\n  src/protected_credential_store.cpp', 'add_executable(desklink-manager WIN32\n  src/setup_main.cpp\n  src/device_identity.cpp\n  src/device_identity.h\n  src/protected_credential_store.cpp')
          replace_exact(cmake, '    advapi32\n    comctl32\n    crypt32', '    advapi32\n    bcrypt\n    comctl32\n    crypt32')
          p = Path(cmake)
          text = p.read_text(encoding='utf-8')
          marker = 'target_link_libraries(desklink-active-session-smoke PRIVATE wtsapi32)'
          if text.count(marker) != 1:
              raise SystemExit('active session smoke marker mismatch')
          addition = '''

          add_executable(desklink-device-identity-smoke
            src/device_identity_smoke.cpp
            src/device_identity.cpp
            src/device_identity.h
          )
          target_compile_definitions(desklink-device-identity-smoke PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          target_compile_options(desklink-device-identity-smoke PRIVATE /W4 /permissive-)
          target_link_libraries(desklink-device-identity-smoke PRIVATE advapi32 bcrypt)'''
          p.write_text(text.replace(marker, marker + addition), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "packaging/windows/install-service.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw (($errors | ForEach-Object { $_.Message }) -join '; ') }

      - name: Configure Windows host
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE

      - name: Build Windows host
        run: cmake --build build/windows-agent --config Release --parallel

      - name: Validate stable identity and existing smokes
        shell: pwsh
        run: |
          foreach ($smokePath in @(
            "build/windows-agent/Release/desklink-device-identity-smoke.exe",
            "build/windows-agent/Release/desklink-video-policy-smoke.exe",
            "build/windows-agent/Release/desklink-active-session-smoke.exe",
            "build/windows-agent/Release/desklink-h264-annexb-smoke.exe"
          )) {
            & (Resolve-Path $smokePath)
            if ($LASTEXITCODE -ne 0) { throw "$smokePath failed with exit code $LASTEXITCODE" }
          }
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          $id1 = (& $service --print-default-device-id | Select-Object -Last 1).Trim()
          $exit1 = $LASTEXITCODE
          $id2 = (& $service --print-default-device-id | Select-Object -Last 1).Trim()
          $exit2 = $LASTEXITCODE
          if ($exit1 -ne 0 -or $exit2 -ne 0 -or $id1 -notmatch '^win-[0-9a-f]{32}$' -or $id1 -ne $id2) {
            throw "Service did not return a stable Device ID: '$id1' / '$id2'"
          }

      - name: Commit validated stable identity wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-agent/src/setup_main.cpp apps/windows-agent/src/service_main.cpp apps/windows-agent/CMakeLists.txt packaging/windows/install-service.ps1
          if (git diff --cached --quiet) { throw "Stable identity wiring produced no changes" }
          git commit -m "feat(windows): keep default Device ID stable across reinstalls"
          git pull --rebase origin main
          git push origin HEAD:main
