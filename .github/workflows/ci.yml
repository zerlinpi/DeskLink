name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desklink-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository version invariants
        run: python tools/version/check-version.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      signal: ${{ steps.filter.outputs.signal }}
      web: ${{ steps.filter.outputs.web }}
      repo: ${{ steps.filter.outputs.repo }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect affected components
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"

          all=false
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            all=true
            changed=""
          else
            changed="$(git diff --name-only "$base" "$head")"
          fi

          affected() {
            local pattern="$1"
            if [[ "$all" == "true" ]]; then
              return 0
            fi
            grep -Eq "$pattern" <<<"$changed"
          }

          signal=false
          web=false
          repo=false
          windows=false

          # Repository-wide invariants affect version/protocol/release semantics.
          # They intentionally trigger every primary implementation so CI cannot
          # report green while all real builds are skipped.
          if affected '^(VERSION$|tools/version/|packages/protocol/|\.github/workflows/)'; then
            signal=true
            web=true
            repo=true
            windows=true
          fi

          affected '^(apps/signal/|tools/auth/|infra/docker-compose\.yml$)' && signal=true
          affected '^(apps/web/|tools/auth/verify-access-proof-vector\.mjs$)' && web=true
          affected '^(tools/network/|infra/)' && repo=true
          affected '^(apps/windows-agent/|packaging/windows/|tools/auth/verify-access-proof-vector\.mjs$)' && windows=true

          # Packaging changes can alter deployable artifacts even when product
          # source did not move. Validate both browser and Windows packaging.
          if affected '^packaging/'; then
            web=true
            repo=true
            windows=true
          fi

          echo "signal=$signal" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

          printf 'Changed files:\n%s\n' "${changed:-<all components>}"
          printf 'Affected: signal=%s web=%s repo=%s windows=%s\n' "$signal" "$web" "$repo" "$windows"

  signal:
    needs: [repository-invariants, changes]
    if: needs.changes.outputs.signal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go mod download
      - run: go test ./...
      - name: Build with project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < ../../VERSION)"
          go build -ldflags="-X main.buildVersion=$version" ./...
      - name: Validate legacy device credential provisioning tool
        env:
          DESKLINK_DEVICE_AUTH_SECRET: ci-device-auth-secret
        run: go run ../../tools/auth/mint-device-credential.go ci-windows-host >/dev/null
      - name: Validate independent device credential rotation tool
        shell: bash
        run: |
          set -euo pipefail
          registry="$(mktemp -u)/devices.json"
          first="$(go run ../../tools/auth/rotate-device-registry-credential.go "$registry" ci-windows-host)"
          second="$(go run ../../tools/auth/rotate-device-registry-credential.go "$registry" ci-windows-host)"
          test -n "$first"
          test -n "$second"
          test "$first" != "$second"
          grep -q '"version": 1' "$registry"
          grep -q '"ci-windows-host"' "$registry"
          if grep -q "$first" "$registry"; then
            echo "registry must contain only the credential hash, not the plaintext credential" >&2
            exit 1
          fi
          if go run ../../tools/auth/rotate-device-registry-credential.go "$registry" '主机' >/dev/null 2>&1; then
            echo "device provisioning tool accepted an ID rejected by the signaling service" >&2
            exit 1
          fi
      - name: Validate controller registry provisioning tool
        shell: bash
        run: |
          set -euo pipefail
          registry="$(mktemp -u)/controllers.json"
          first="$(go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller ci-windows-host ci-laptop)"
          second="$(go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller ci-windows-host)"
          test -n "$first"
          test -n "$second"
          test "$first" != "$second"
          grep -q '"version": 1' "$registry"
          grep -q '"ci-controller"' "$registry"
          grep -q '"ci-windows-host"' "$registry"
          if grep -q "$second" "$registry"; then
            echo "controller registry must contain only the key hash, not the plaintext key" >&2
            exit 1
          fi
          if go run ../../tools/auth/set-controller-registry-key.go "$registry" '管理员' ci-windows-host >/dev/null 2>&1; then
            echo "controller provisioning tool accepted an account ID rejected by the signaling service" >&2
            exit 1
          fi
          if go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller '主机' >/dev/null 2>&1; then
            echo "controller provisioning tool accepted a device ID rejected by the signaling service" >&2
            exit 1
          fi

  web:
    needs: [repository-invariants, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate Access Code proof vector
        run: node ../../tools/auth/verify-access-proof-vector.mjs
      - name: Install locked Web dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  repo-checks:
    needs: [repository-invariants, changes]
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate network helper syntax
        run: bash -n tools/network/shape-linux.sh tools/network/reset-linux.sh tools/network/check-turn-tls.sh
      - name: Validate development Compose config
        env:
          DESKLINK_SIGNAL_AUTH_SECRET: ci-test-secret
        run: docker compose -f infra/docker-compose.yml config >/dev/null

  windows-agent:
    needs: [repository-invariants, changes]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('VERSION', 'apps/windows-agent/CMakeLists.txt', 'packages/protocol/**') }}
      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "packaging/windows/install-service.ps1",
            "packaging/windows/uninstall-service.ps1",
            "packaging/windows/sign-binaries.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join "; "
              throw "$script has PowerShell syntax errors: $messages"
            }
          }
      - name: Configure
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64 -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE
      - name: Validate static OpenSSL selection
        shell: pwsh
        run: |
          $cache = Get-Content "build/windows-agent/CMakeCache.txt" -Raw
          if ($cache -match '(?im)^OPENSSL_(CRYPTO|SSL)_LIBRARY[^=]*=.*[\\/]MDd?[\\/]') {
            throw "CMake selected an OpenSSL /MD library instead of the portable /MT/static variant"
          }
      - name: Build
        run: cmake --build build/windows-agent --config Release --parallel
      - name: Validate portable Windows dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual C++ build tools installation was not found" }
          $dumpbin = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }

          $forbidden = '(?im)^\s*(VCRUNTIME[^\s]*\.dll|MSVCP[^\s]*\.dll|libcrypto[^\s]*\.dll|libssl[^\s]*\.dll|datachannel[^\s]*\.dll)\s*$'
          $binaries = @(
            "build/windows-agent/Release/DeskLink.exe",
            "build/windows-agent/Release/desklink-agent.exe",
            "build/windows-agent/Release/desklink-service.exe",
            "build/windows-agent/Release/desklink-media-probe.exe"
          )
          foreach ($binary in $binaries) {
            if (-not (Test-Path $binary)) { throw "missing artifact binary: $binary" }
            $dependencies = & $dumpbin.FullName /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            $dependencyText = $dependencies -join "`n"
            Write-Host "Dependencies for ${binary}:"
            Write-Host $dependencyText
            if ($dependencyText -match $forbidden) {
              throw "$binary has an external runtime dependency that must be bundled or statically linked"
            }
          }
      - name: Validate H264 Annex-B normalization
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-h264-annexb-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "H264 Annex-B smoke failed with exit code $LASTEXITCODE" }
      - name: Validate high-refresh video policy
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-video-policy-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Video policy smoke failed with exit code $LASTEXITCODE" }
      - name: Validate active Windows session selection
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-active-session-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Active session smoke failed with exit code $LASTEXITCODE" }
      - name: Validate Device ID derivation
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-device-identity-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Device identity smoke failed with exit code $LASTEXITCODE" }
      - name: Validate Secure Attention API fail-closed behavior
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-secure-attention-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Secure Attention smoke failed with exit code $LASTEXITCODE" }
      - name: Validate Access Code proof vector
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-access-proof-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Access Code proof smoke failed with exit code $LASTEXITCODE" }
      - name: Validate DPAPI protected secrets
        shell: pwsh
        run: |
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          "dc1.CI_DPAPI_LEGACY_SMOKE_0123456789" | & $service --store-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI legacy dc1 store failed with exit code $LASTEXITCODE" }
          "dc2.CI_DPAPI_REGISTRY_SMOKE_0123456789" | & $service --store-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI registry dc2 store failed with exit code $LASTEXITCODE" }
          "CI-Access-Code-Smoke-0123456789!" | & $service --store-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access-code store failed with exit code $LASTEXITCODE" }
          & $service --clear-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access-code cleanup failed with exit code $LASTEXITCODE" }
          & $service --clear-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI device credential cleanup failed with exit code $LASTEXITCODE" }
      - name: Validate Service auth broker
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-service-auth-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Service auth broker smoke test failed with exit code $LASTEXITCODE" }
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desklink-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows-agent/Release/DeskLink.exe
            build/windows-agent/Release/desklink-agent.exe
            build/windows-agent/Release/desklink-service.exe
            build/windows-agent/Release/desklink-media-probe.exe
