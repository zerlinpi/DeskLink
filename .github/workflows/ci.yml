name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desklink-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('apps/windows-agent/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64
      - name: Build
        run: cmake --build build/windows-agent --config Release --parallel
