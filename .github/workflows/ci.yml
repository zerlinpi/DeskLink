name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desklink-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go mod download
      - run: go test ./...
      - run: go build ./...
      - name: Validate legacy device credential provisioning tool
        env:
          DESKLINK_DEVICE_AUTH_SECRET: ci-device-auth-secret
        run: go run ../../tools/auth/mint-device-credential.go ci-windows-host >/dev/null
      - name: Validate independent device credential rotation tool
        shell: bash
        run: |
          set -euo pipefail
          registry="$(mktemp -u)/devices.json"
          first="$(go run ../../tools/auth/rotate-device-registry-credential.go "$registry" ci-windows-host)"
          second="$(go run ../../tools/auth/rotate-device-registry-credential.go "$registry" ci-windows-host)"
          test -n "$first"
          test -n "$second"
          test "$first" != "$second"
          grep -q '"version": 1' "$registry"
          grep -q '"ci-windows-host"' "$registry"
          if grep -q "$first" "$registry"; then
            echo "registry must contain only the credential hash, not the plaintext credential" >&2
            exit 1
          fi
          if go run ../../tools/auth/rotate-device-registry-credential.go "$registry" '主机' >/dev/null 2>&1; then
            echo "device provisioning tool accepted an ID rejected by the signaling service" >&2
            exit 1
          fi
      - name: Validate controller registry provisioning tool
        shell: bash
        run: |
          set -euo pipefail
          registry="$(mktemp -u)/controllers.json"
          first="$(go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller ci-windows-host ci-laptop)"
          second="$(go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller ci-windows-host)"
          test -n "$first"
          test -n "$second"
          test "$first" != "$second"
          grep -q '"version": 1' "$registry"
          grep -q '"ci-controller"' "$registry"
          grep -q '"ci-windows-host"' "$registry"
          if grep -q "$second" "$registry"; then
            echo "controller registry must contain only the key hash, not the plaintext key" >&2
            exit 1
          fi
          if go run ../../tools/auth/set-controller-registry-key.go "$registry" '管理员' ci-windows-host >/dev/null 2>&1; then
            echo "controller provisioning tool accepted an account ID rejected by the signaling service" >&2
            exit 1
          fi
          if go run ../../tools/auth/set-controller-registry-key.go "$registry" ci-controller '主机' >/dev/null 2>&1; then
            echo "controller provisioning tool accepted a device ID rejected by the signaling service" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate network helper syntax
        run: bash -n tools/network/shape-linux.sh tools/network/reset-linux.sh tools/network/check-turn-tls.sh
      - name: Validate development Compose config
        env:
          DESKLINK_SIGNAL_AUTH_SECRET: ci-test-secret
        run: docker compose -f infra/docker-compose.yml config >/dev/null

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('apps/windows-agent/CMakeLists.txt') }}
          restore-keys: |
            desklink-windows-${{ runner.os }}-
      - name: Configure
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64
      - name: Build
        run: cmake --build build/windows-agent --config Release --parallel
      - name: Validate DPAPI protected secrets
        shell: pwsh
        run: |
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          "dc1.CI_DPAPI_SMOKE_TEST_0123456789" | & $service --store-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI device credential store failed with exit code $LASTEXITCODE" }
          "CI-Access-Code-Smoke-0123456789!" | & $service --store-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access-code store failed with exit code $LASTEXITCODE" }
          & $service --clear-access-code
          if ($LASTEXITCODE -ne 0) { throw "DPAPI access-code cleanup failed with exit code $LASTEXITCODE" }
          & $service --clear-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI device credential cleanup failed with exit code $LASTEXITCODE" }
      - name: Validate Service auth broker
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-service-auth-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Service auth broker smoke test failed with exit code $LASTEXITCODE" }
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desklink-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows-agent/Release/desklink-agent.exe
            build/windows-agent/Release/desklink-service.exe
