name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desklink-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go mod download
      - run: go test ./...
      - run: go build ./...
      - name: Validate device credential provisioning tool
        env:
          DESKLINK_DEVICE_AUTH_SECRET: ci-device-auth-secret
        run: go run ../../tools/auth/mint-device-credential.go ci-windows-host >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate network helper syntax
        run: bash -n tools/network/shape-linux.sh tools/network/reset-linux.sh tools/network/check-turn-tls.sh
      - name: Validate development Compose config
        env:
          DESKLINK_SIGNAL_AUTH_SECRET: ci-test-secret
        run: docker compose -f infra/docker-compose.yml config >/dev/null

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: build/windows-agent
          key: desklink-windows-${{ runner.os }}-${{ hashFiles('apps/windows-agent/CMakeLists.txt') }}
          restore-keys: |
            desklink-windows-${{ runner.os }}-
      - name: Configure
        run: cmake -S apps/windows-agent -B build/windows-agent -A x64
      - name: Build
        run: cmake --build build/windows-agent --config Release --parallel
      - name: Validate DPAPI credential store
        shell: pwsh
        run: |
          $service = Resolve-Path "build/windows-agent/Release/desklink-service.exe"
          "dc1.CI_DPAPI_SMOKE_TEST_0123456789" | & $service --store-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI credential store failed with exit code $LASTEXITCODE" }
          & $service --clear-device-credential
          if ($LASTEXITCODE -ne 0) { throw "DPAPI credential cleanup failed with exit code $LASTEXITCODE" }
      - name: Validate Service auth broker
        shell: pwsh
        run: |
          $smoke = Resolve-Path "build/windows-agent/Release/desklink-service-auth-smoke.exe"
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Service auth broker smoke test failed with exit code $LASTEXITCODE" }
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desklink-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows-agent/Release/desklink-agent.exe
            build/windows-agent/Release/desklink-service.exe
