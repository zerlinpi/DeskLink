name: Packages

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - VERSION
      - apps/signal/**
      - .github/workflows/packages.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desklink-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read and validate project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "VERSION must be semantic major.minor.patch with an optional prerelease suffix" >&2
            exit 1
          fi

          stable=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags cannot point at a prerelease VERSION" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" != "v$version" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION v$version" >&2
              exit 1
            fi
            stable=true
          fi

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/desklink-signal" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve image tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=DeskLink Signal
            org.opencontainers.image.description=DeskLink signaling, authentication and temporary TURN credential service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish signal image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/signal
          file: ./apps/signal/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            DESKLINK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
