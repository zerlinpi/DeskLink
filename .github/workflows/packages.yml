name: Packages

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - VERSION
      - apps/signal/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - tools/version/**
      - .github/workflows/packages.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desklink-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Validate project version and tag binding
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(python tools/version/check-version.py --tag "${GITHUB_REF_NAME}")"
          else
            version="$(python tools/version/check-version.py)"
          fi

          stable=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$version" != *-* ]]; then
            stable=true
          fi

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/desklink-signal" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve immutable/release-safe image tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=DeskLink Signal
            org.opencontainers.image.description=DeskLink signaling, authentication and temporary TURN credential service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish signal image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/signal
          file: ./apps/signal/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            DESKLINK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
