name: One-shot adaptive receiver latency integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-receiver-latency.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Integrate adaptive video receiver jitter target
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''import {\n  POINTER_MOVE_BUFFER_BUDGET_BYTES,\n  shouldDeferPointerMove,\n} from "./pointer_transport";\n''',
                  '''import {\n  POINTER_MOVE_BUFFER_BUDGET_BYTES,\n  shouldDeferPointerMove,\n} from "./pointer_transport";\nimport {\n  INITIAL_VIDEO_JITTER_BUFFER_TARGET_MS,\n  trySetJitterBufferTarget,\n  videoJitterBufferTargetMs,\n} from "./receiver_latency";\n''',
              ),
              (
                  '''      const availableIncomingBitrate = selectedPair?.availableIncomingBitrate != null\n        ? Number(selectedPair.availableIncomingBitrate)\n        : null;\n\n      setNetworkView({\n''',
                  '''      const availableIncomingBitrate = selectedPair?.availableIncomingBitrate != null\n        ? Number(selectedPair.availableIncomingBitrate)\n        : null;\n\n      const videoReceiver = pc.getReceivers().find((receiver) => receiver.track.kind === "video");\n      if (videoReceiver) {\n        trySetJitterBufferTarget(\n          videoReceiver,\n          videoJitterBufferTargetMs(jitterMs, lossPct),\n        );\n      }\n\n      setNetworkView({\n''',
              ),
              (
                  '''      const pc = createPeer(iceServers);\n      const transceiver = pc.addTransceiver("video", { direction: "recvonly" });\n      const videoCapabilities = RTCRtpReceiver.getCapabilities("video");\n''',
                  '''      const pc = createPeer(iceServers);\n      const transceiver = pc.addTransceiver("video", { direction: "recvonly" });\n      trySetJitterBufferTarget(\n        transceiver.receiver,\n        INITIAL_VIDEO_JITTER_BUFFER_TARGET_MS,\n      );\n      const videoCapabilities = RTCRtpReceiver.getCapabilities("video");\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one receiver latency anchor, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Web tests
        working-directory: apps/web
        run: npm test
      - name: Build Web production bundle
        working-directory: apps/web
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "perf(web): adapt video jitter buffer to live network conditions"
          git push origin HEAD:main
