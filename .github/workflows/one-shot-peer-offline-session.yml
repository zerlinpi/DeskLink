name: One-shot peer-offline session scoping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-peer-offline-session.yml

permissions:
  contents: write

jobs:
  verify-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Assert peer-offline session at the WebSocket boundary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/signal/signal_e2e_test.go')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'func expectSignalE2EPeerOffline(\n\tt *testing.T,\n\tcontroller *websocket.Conn,\n\thostID string,\n\texpectQueued bool,\n) {',
                  'func expectSignalE2EPeerOffline(\n\tt *testing.T,\n\tcontroller *websocket.Conn,\n\thostID string,\n\tsession string,\n\texpectQueued bool,\n) {',
              ),
              (
                  '\tif message.Type != "peer-offline" || message.Target != hostID {\n\t\tt.Fatalf("expected peer-offline for %s, got %+v", hostID, message)\n\t}\n',
                  '\tif message.Type != "peer-offline" || message.Target != hostID || message.Session != session {\n\t\tt.Fatalf("expected peer-offline for %s session %s, got %+v", hostID, session, message)\n\t}\n',
              ),
              (
                  '\t\twriteSignalE2EAuthRequest(t, controller, hostID, session)\n\t\texpectSignalE2EPeerOffline(t, controller, hostID, true)\n',
                  '\t\twriteSignalE2EAuthRequest(t, controller, hostID, session)\n\t\texpectSignalE2EPeerOffline(t, controller, hostID, session, true)\n',
              ),
              (
                  '\t\twriteSignalE2EAuthRequest(t, oldController, hostID, oldSession)\n\t\texpectSignalE2EPeerOffline(t, oldController, hostID, true)\n',
                  '\t\twriteSignalE2EAuthRequest(t, oldController, hostID, oldSession)\n\t\texpectSignalE2EPeerOffline(t, oldController, hostID, oldSession, true)\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one signal_e2e anchor, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          gofmt -w apps/signal/signal_e2e_test.go
          git diff --check

      - name: Run signaling unit and WebSocket E2E tests
        working-directory: apps/signal
        run: go test ./...

      - name: Commit E2E contract coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/signal/signal_e2e_test.go
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(signal): assert peer-offline session over websocket"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
